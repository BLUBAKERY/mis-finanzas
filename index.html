  const [monto, setMonto] = useState("");
  const [moneda, setMoneda] = useState("ARS");
  const [direccion, setDireccion] = useState("me_deben");
  const [saldando, setSaldando] = useState(null);

  const crear = () => {
    const m = parseMonto(monto);
    if (!persona.trim() || isNaN(m) || m <= 0) return;
    guardar({
      ...data,
      deudas: [{ id: uid(), persona: persona.trim(), concepto: concepto.trim(), monto: m, moneda, direccion, saldada: false, fecha: hoy() }, ...data.deudas],
    });
    setPersona(""); setConcepto(""); setMonto(""); setMostrarForm(false);
    avisar("Deuda anotada");
  };

  const saldar = (deuda, cuentaId) => {
    const mov = {
      id: uid(),
      tipo: deuda.direccion === "me_deben" ? "ingreso" : "gasto",
      monto: deuda.monto,
      cuentaId,
      fecha: hoy(),
      grupo: deuda.direccion === "me_deben" ? "Ingresos" : "Personales",
      categoria: deuda.direccion === "me_deben" ? "Otros ingresos" : "Otros personales",
      nota: `${deuda.direccion === "me_deben" ? "Cobro a" : "Pago a"} ${deuda.persona}${deuda.concepto ? " — " + deuda.concepto : ""}`,
    };
    guardar({
      ...data,
      movs: [mov, ...data.movs],
      deudas: data.deudas.map((d) => (d.id === deuda.id ? { ...d, saldada: true } : d)),
    });
    setSaldando(null);
    avisar("Deuda saldada y movimiento anotado ✓");
  };

  const activas = data.deudas.filter((d) => !d.saldada);
  const cuentasCompatibles = (mon) => data.cuentas.filter((c) => c.moneda === mon && c.clase !== "credito");

  return (
    <div style={{ marginTop: 26 }}>
      <div style={S.fechaHeader}>Deudas</div>

      {activas.length === 0 && !mostrarForm && (
        <div style={{ fontSize: 13.5, color: C.tintaSuave, marginBottom: 10 }}>Sin deudas pendientes con personas. 🌿</div>
      )}

      {activas.map((d) => (
        <div key={d.id} style={S.card}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
            <div>
              <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: d.direccion === "me_deben" ? C.ingreso : C.gasto }}>
                {d.direccion === "me_deben" ? "Me debe" : "Le debo"}
              </div>
              <div style={{ fontSize: 16, fontWeight: 700, color: C.tinta }}>{d.persona}</div>
              {d.concepto && <div style={{ fontSize: 13, color: C.tintaSuave }}>{d.concepto}</div>}
            </div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.tinta, fontVariantNumeric: "tabular-nums" }}>{fmt(d.monto, d.moneda)}</div>
          </div>
          {saldando === d.id ? (
            <div style={{ marginTop: 10 }}>
              <label style={{ ...S.label, marginTop: 0 }}>{d.direccion === "me_deben" ? "¿A qué cuenta entra?" : "¿De qué cuenta sale?"}</label>
              <div style={S.chips}>
                {cuentasCompatibles(d.moneda).map((c) => (
                  <Chip key={c.id} dot={colorEntidad(c.entidad)} onClick={() => saldar(d, c.id)}>{etiquetaCuenta(c)}</Chip>
                ))}
              </div>
              <button style={S.btnFantasma} onClick={() => setSaldando(null)}>Cancelar</button>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <button style={{ ...S.btnSecundario, flex: 1 }} onClick={() => setSaldando(d.id)}>Marcar como saldada</button>
              <button style={S.btnMini} onClick={() => { guardar({ ...data, deudas: data.deudas.filter((x) => x.id !== d.id) }); avisar("Deuda borrada"); }}>
                borrar
              </button>
            </div>
          )}
        </div>
      ))}

      {mostrarForm ? (
        <div style={S.card}>
          <div style={S.chips}>
            <Chip activo={direccion === "me_deben"} onClick={() => setDireccion("me_deben")}>Me deben</Chip>
            <Chip activo={direccion === "debo"} onClick={() => setDireccion("debo")}>Debo</Chip>
          </div>
          <input style={S.input} placeholder="¿Quién?" value={persona} onChange={(e) => setPersona(e.target.value)} />
          <input style={S.input} placeholder="¿Por qué? (opcional)" value={concepto} onChange={(e) => setConcepto(e.target.value)} />
          <div style={{ display: "flex", gap: 8 }}>
            <input style={{ ...S.input, flex: 1 }} inputMode="decimal" placeholder="Monto" value={monto} onChange={(e) => setMonto(e.target.value)} />
            <div style={{ ...S.chips, marginBottom: 12 }}>
              <Chip activo={moneda === "ARS"} onClick={() => setMoneda("ARS")}>$</Chip>
              <Chip activo={moneda === "USD"} onClick={() => setMoneda("USD")}>US$</Chip>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button style={{ ...S.btnPrimario, flex: 1, marginTop: 0 }} onClick={crear}>Guardar</button>
            <button style={S.btnSecundario} onClick={() => setMostrarForm(false)}>Cancelar</button>
          </div>
        </div>
      ) : (
        <button style={{ ...S.btnSecundario, width: "100%" }} onClick={() => setMostrarForm(true)}>+ Anotar deuda</button>
      )}
    </div>
  );
}

// ————— Respaldo —————
function Respaldo({ data, guardar, avisar }) {
  const fileRef = useRef(null);

  const exportar = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `finanzas-respaldo-${hoy()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    avisar("Copia descargada ✓");
  };

  const importar = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!d.cuentas || !d.movs || !d.grupos) throw new Error("formato");
        guardar(d);
        avisar("Datos restaurados desde tu copia ✓");
      } catch {
        avisar("Ese archivo no parece una copia válida");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{ marginTop: 26, marginBottom: 10 }}>
      <div style={S.fechaHeader}>Respaldo</div>
      <div style={{ fontSize: 12.5, color: C.gris, marginBottom: 8, lineHeight: 1.5 }}>
        Tus datos se guardan solos en tu cuenta, protegidos por tu contraseña. Con la copia tenés un respaldo extra en tu dispositivo.
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button style={{ ...S.btnSecundario, flex: 1 }} onClick={exportar}>Descargar copia</button>
        <button style={{ ...S.btnSecundario, flex: 1 }} onClick={() => fileRef.current && fileRef.current.click()}>Restaurar copia</button>
        <input ref={fileRef} type="file" accept=".json" style={{ display: "none" }} onChange={importar} />
      </div>
    </div>
  );
}

// ————— Piezas —————
function Chip({ activo, onClick, dot, children }) {
  return (
    <button
      onClick={onClick}
      style={{
        ...S.chipBase,
        background: activo ? C.lav : C.carta,
        color: activo ? "#fff" : C.tinta,
        borderColor: activo ? C.lav : C.linea,
        fontWeight: activo ? 700 : 500,
        display: "inline-flex",
        alignItems: "center",
        gap: 6,
      }}
    >
      {dot && <span style={{ width: 8, height: 8, borderRadius: 4, background: activo ? "#fff" : dot, display: "inline-block", flexShrink: 0 }} />}
      {children}
    </button>
  );
}
