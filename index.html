<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap');

:root{
  --a1:#f3c9dc; --a2:#d9a6c2; --a3:#efe3d0; --tx:#3a2630;
  --cream:#fbf7f0; --ink:#2b2620; --ink-soft:#6b5f57;
  --radius:22px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Jost', sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Poppins', sans-serif; font-weight:300;}
button{font-family:inherit; cursor:pointer; border:none;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--a1); color:var(--tx);}
a{color:inherit;}

.hidden{display:none !important;}

/* ---------- Watercolor wash ---------- */
.wash{
  position:relative;
  background:
    radial-gradient(ellipse 80% 60% at 15% 20%, color-mix(in srgb, var(--a1) 80%, transparent), transparent),
    radial-gradient(ellipse 70% 70% at 85% 30%, color-mix(in srgb, var(--a2) 70%, transparent), transparent),
    radial-gradient(ellipse 90% 80% at 50% 90%, color-mix(in srgb, var(--a3) 85%, transparent), transparent),
    linear-gradient(135deg, var(--a2), var(--a1) 60%, var(--a3));
  color:var(--tx);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px;
  background:rgba(251,247,240,.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.brand{display:flex; align-items:center; gap:10px; font-family:'Poppins'; font-weight:500; font-size:17px; letter-spacing:.2px; background:none;}
.brand svg{flex-shrink:0;}
.cart-btn{
  position:relative; display:flex; align-items:center; justify-content:center;
  width:42px; height:42px; border-radius:50%; background:var(--ink); color:#fff;
}
.cart-count{
  position:absolute; top:-4px; right:-4px; background:#c2503f; color:#fff;
  font-size:11px; width:19px; height:19px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-family:'Jost';
}

/* ---------- Hero ---------- */
.hero{
  padding:64px 24px 46px;
  min-height:64vh;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start;}
.hero-eyebrow{
  font-size:13px; letter-spacing:1.5px; text-transform:uppercase; text-align:right;
  line-height:1.5; opacity:.85; max-width:160px;
}
.hero-title{
  font-family:'Poppins'; font-weight:300; font-size:clamp(60px, 13vw, 118px);
  line-height:.92; margin:26px 0 10px;
}
.hero-sub{font-size:17px; max-width:420px; line-height:1.5; opacity:.9;}

.info-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:12px;
  margin:0 20px 16px;
}
.info-card{border-radius:18px; padding:20px; color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08);}
.info-card .info-icon{font-size:24px; margin-bottom:8px; display:block;}
.info-card .info-title{font-family:'Poppins'; font-weight:600; font-size:14.5px; margin-bottom:4px; letter-spacing:.2px;}
.info-card .info-text{font-size:13px; line-height:1.45; opacity:.96;}

.notice-strip{
  margin:0 20px 14px; padding:16px 18px; border-radius:16px; background:#3a2620; color:#fbe8de;
  font-size:14px; font-weight:500; text-align:center; line-height:1.5;
}
.fresh-strip{
  margin:0 20px 22px; padding:15px 18px; border-radius:16px; background:#fff2cf; color:#5c4b1f;
  font-size:13.5px; text-align:center; line-height:1.55;
}
.map-block{margin:0 20px 26px;}
.map-heading{padding:0 2px 10px; font-family:'Poppins'; font-weight:500; font-size:16px;}

.whatsapp-cta{
  margin:0 20px 26px; padding:18px 22px; background:#25D366; color:#fff; border-radius:18px;
  display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;
  font-family:'Poppins'; font-weight:500; font-size:19px; text-align:center;
}
.whatsapp-cta:active{transform:scale(.98);}
.promo-banner{
  margin:0 22px 4px; padding:14px 18px; border-radius:14px; background:var(--ink); color:#fff;
  font-size:14px; font-weight:500; text-align:center;
}
.hero-arrow{margin-top:34px;}

/* ---------- Section grid (home) ---------- */
.section-index{padding:8px 20px 60px;}
.index-label{
  padding:0 4px 18px; font-size:14px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); font-weight:600;
}
.tile-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:16px;
}
.tile{
  border-radius:var(--radius); padding:30px 22px; min-height:168px;
  display:flex; flex-direction:column; justify-content:space-between;
  color:var(--tx); text-align:left; transition:transform .15s ease; box-shadow:0 2px 10px rgba(0,0,0,.07);
}
.tile:active{transform:scale(.96);}
.tile .tile-icon{font-size:32px;}
.tile .tile-name{font-family:'Poppins'; font-size:19px; font-weight:600; margin-top:10px;}
.tile .tile-count{font-size:12.5px; opacity:.8; margin-top:4px;}

.footer-strip{
  padding:30px 24px 40px; border-top:1px solid rgba(0,0,0,.07); margin-top:20px;
  display:flex; flex-wrap:wrap; gap:18px; justify-content:space-between; align-items:center;
  font-size:13px; color:var(--ink-soft);
}
.footer-strip a{text-decoration:underline; text-underline-offset:3px;}

/* ---------- Section page ---------- */
.section-header{padding:40px 22px 34px;}
.back-row{display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:22px; opacity:.85;}
.back-row button{background:none; color:inherit; display:flex; align-items:center; gap:6px;}
.section-title{font-family:'Poppins'; font-weight:300; font-size:clamp(44px,10vw,72px);}

.group-block{padding:26px 0 6px;}
.group-title{padding:0 22px 14px; font-family:'Poppins'; font-size:19px; font-weight:500;}
.row-scroll{
  display:flex; gap:14px; overflow-x:auto; padding:2px 22px 14px; scroll-snap-type:x proximity;
}
.row-scroll::-webkit-scrollbar{height:6px;}
.row-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15); border-radius:10px;}

.card{
  scroll-snap-align:start;
  flex:0 0 210px; background:#fff; border-radius:18px; overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; flex-direction:column;
}
.card-img{
  position:relative; width:100%; height:230px; background:#eee5da;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.card-img img{width:100%; height:100%; object-fit:cover;}
.price-tag{
  position:absolute; left:10px; bottom:10px; padding:6px 12px; border-radius:20px;
  font-size:14px; font-family:'Jost'; font-weight:500;
}
.card-body{padding:12px 13px 14px; display:flex; flex-direction:column; gap:8px; flex:1;}
.card-name{font-family:'Poppins'; font-size:17.5px; font-weight:600; line-height:1.25; min-height:auto;}

@media (min-width: 700px){
  .row-scroll{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    overflow-x: visible;
  }
  .card{ flex:none; width:100%; }
  .hero-title{ font-size:clamp(60px, 8vw, 118px); }
  .section-title{ font-size:clamp(44px, 6vw, 72px); }
  .tile-grid{ grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); }
}
@media (min-width: 1100px){
  .topbar, .hero, .delivery-banner, .whatsapp-cta, .section-index, .footer-strip, .section-header, .group-block{
    max-width:1400px; margin-left:auto; margin-right:auto;
  }
  .wash.hero, .wash.section-header{ max-width:none; }
  .hero > *, .section-header > *{ max-width:1400px; margin-left:auto; margin-right:auto; }
}
.card-tags{display:flex; gap:6px; flex-wrap:wrap;}
.tag{font-size:10.5px; padding:3px 8px; border-radius:20px; background:#f1ece3; color:var(--ink-soft);}
.want-btn{
  margin-top:auto; background:var(--ink); color:#fff; padding:9px; border-radius:20px;
  font-size:13.5px; letter-spacing:.3px; display:flex; align-items:center; justify-content:center; gap:6px;
}
.want-btn:active{transform:scale(.97);}

.empty-note{padding:40px 22px; color:var(--ink-soft); font-size:14px;}

/* ---------- Modal / overlay ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(30,24,20,.45); z-index:90;
  display:flex; justify-content:flex-end; backdrop-filter:blur(2px);
}
.overlay.center{justify-content:center; align-items:center; padding:20px;}
.panel{
  background:#fff; width:min(420px,100%); height:100%; overflow-y:auto;
  display:flex; flex-direction:column;
  animation:slidein .22s ease;
}
@keyframes slidein{from{transform:translateX(100%)} to{transform:translateX(0)}}
.sheet{
  background:#fff; width:min(480px,100%); max-height:92vh; overflow-y:auto; border-radius:20px;
  animation:popin .16s ease;
}
@keyframes popin{from{opacity:0; transform:scale(.97)} to{opacity:1; transform:scale(1)}}
.panel-head{
  display:flex; justify-content:space-between; align-items:center; padding:18px 20px;
  border-bottom:1px solid #eee; position:sticky; top:0; background:#fff; z-index:2;
}
.panel-head h3{font-family:'Poppins'; font-weight:500; font-size:17px;}
.close-x{width:32px; height:32px; border-radius:50%; background:#f2ede6; display:flex; align-items:center; justify-content:center;}

.detail-modal{
  background:#fff; width:min(640px, 94vw); max-height:92vh; overflow-y:auto; border-radius:20px;
  animation:popin .16s ease;
}
@media (min-width:700px){ .detail-modal{ width:min(880px, 90vw); } }

/* product detail */
.detail-imgs{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:4px;}
.detail-imgs img{width:100%; height:auto; display:block; cursor:zoom-in;}
.detail-body{padding:20px 22px 30px; display:flex; flex-direction:column; gap:14px;}
.detail-price{font-family:'Poppins'; font-size:26px; font-weight:500;}
.detail-desc{font-size:14.5px; line-height:1.6; color:var(--ink-soft);}
.spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:13.5px;}
.spec-grid div span{display:block; color:var(--ink-soft); font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px;}
.qty-row{display:flex; align-items:center; gap:14px;}
.qty-btn{width:34px; height:34px; border-radius:50%; background:#f2ede6; font-size:17px;}
.primary-btn{
  background:var(--ink); color:#fff; padding:14px; border-radius:14px; font-size:15px; text-align:center;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.primary-btn:active{transform:scale(.98);}
.ghost-btn{background:#f2ede6; color:var(--ink); padding:12px; border-radius:14px; font-size:14px; text-align:center;}
.lightbox{
  position:fixed; inset:0; background:rgba(15,12,10,.94); z-index:300;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.lightbox img{max-width:100%; max-height:100%; object-fit:contain;}
.lightbox-close{
  position:absolute; top:18px; right:18px; width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,.15); color:#fff; display:flex; align-items:center; justify-content:center;
}

/* cart */
.cart-item{display:flex; gap:12px; padding:14px 20px; border-bottom:1px solid #f1ece3;}
.cart-item img{width:64px; height:78px; object-fit:cover; border-radius:10px; background:#eee5da;}
.cart-item-info{flex:1; display:flex; flex-direction:column; gap:6px;}
.cart-item-top{display:flex; justify-content:space-between; gap:8px;}
.cart-item-name{font-size:14px; font-weight:500;}
.cart-item-price{font-size:13.5px; color:var(--ink-soft);}
.cart-qty{display:flex; align-items:center; gap:10px;}
.cart-qty button{width:24px; height:24px; border-radius:50%; background:#f2ede6; font-size:14px;}
.trash-btn{color:#a35847; font-size:12.5px; text-decoration:underline;}
.cart-footer{padding:18px 20px 26px; border-top:1px solid #eee; position:sticky; bottom:0; background:#fff;}
.cart-total-row{display:flex; justify-content:space-between; font-family:'Poppins'; font-size:17px; margin-bottom:14px;}

/* forms */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px;}
.field input, .field textarea, .field select{
  padding:11px 13px; border:1px solid #e2dbcf; border-radius:12px; font-size:14.5px; background:#fbf9f5;
}
.field textarea{resize:vertical; min-height:70px;}
.radio-group{display:flex; gap:10px;}
.radio-opt{
  flex:1; border:1px solid #e2dbcf; border-radius:12px; padding:12px; font-size:13.5px; text-align:center; background:#fbf9f5;
}
.radio-opt.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.info-box{background:#f6f2ea; border-radius:14px; padding:14px 16px; font-size:13.5px; line-height:1.6; color:var(--ink-soft);}
.info-box b{color:var(--ink);}
.map-frame{width:100%; height:150px; border:0; border-radius:12px; margin-top:10px;}

/* toast */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 22px; border-radius:30px; font-size:14px;
  opacity:0; transition:all .25s ease; z-index:200; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* admin */
.admin-login{min-height:70vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.admin-login-box{width:min(340px,100%); text-align:center;}
.admin-tabs{display:flex; gap:8px; padding:16px 20px 0; overflow-x:auto;}
.admin-tab{padding:9px 16px; border-radius:20px; font-size:13.5px; background:#f2ede6; white-space:nowrap;}
.admin-tab.active{background:var(--ink); color:#fff;}
.admin-body{padding:18px 20px 60px;}
.admin-row{
  display:flex; gap:12px; align-items:center; padding:12px; border:1px solid #eee; border-radius:14px; margin-bottom:10px;
}
.admin-row img{width:52px; height:64px; object-fit:cover; border-radius:8px; background:#eee5da; flex-shrink:0;}
.admin-row-info{flex:1; min-width:0;}
.admin-row-info .n{font-size:14px; font-weight:500;}
.admin-row-info .m{font-size:12.5px; color:var(--ink-soft);}
.switch{
  width:40px; height:23px; border-radius:20px; background:#ddd4c6; position:relative; flex-shrink:0;
}
.switch.on{background:#7a9169;}
.switch::after{
  content:''; position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:#fff;
  transition:transform .15s ease;
}
.switch.on::after{transform:translateX(17px);}
.icon-btn{width:32px; height:32px; border-radius:50%; background:#f2ede6; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.order-card{border:1px solid #eee; border-radius:14px; padding:14px 16px; margin-bottom:12px;}
.order-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
.order-items{font-size:13px; color:var(--ink-soft); line-height:1.6; margin:8px 0;}
.status-select{margin-top:8px;}
.thumb-row{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}
.thumb{position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden; background:#eee5da;}
.thumb-order{position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-between; padding:2px;}
.thumb-mv{width:20px; height:20px; border-radius:4px; background:rgba(0,0,0,.55); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center;}
.thumb img{width:100%; height:100%; object-fit:cover;}
.thumb .rm{position:absolute; top:1px; right:1px; width:16px; height:16px; background:rgba(0,0,0,.6); color:#fff; border-radius:50%; font-size:10px; display:flex; align-items:center; justify-content:center;}
.section-chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.section-chip{padding:8px 14px; border-radius:20px; font-size:13px; background:#f2ede6; display:flex; align-items:center; gap:8px;}
.small-x{width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,.12); font-size:11px; display:flex; align-items:center; justify-content:center;}
.confirm-screen{padding:60px 24px; text-align:center; min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;}
.variant-chips{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0;}
.variant-chip{
  padding:9px 14px; border-radius:20px; font-size:13.5px; border:1.5px solid #e2dbcf; background:#fbf9f5;
}
.variant-chip.selected{background:var(--ink); color:#fff; border-color:var(--ink);}
.variant-chip.disabled{opacity:.35; text-decoration:line-through; pointer-events:none;}
.variant-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.variant-row input{flex:1; padding:9px 11px; border:1px solid #e2dbcf; border-radius:10px; font-size:13.5px;}
.promo-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.promo-row input, .promo-row select{padding:9px 11px; border:1px solid #e2dbcf; border-radius:10px; font-size:13.5px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SUPABASE
   ============================================================ */
const SUPABASE_URL = 'https://sxejkjtgzdmfglqcvdmq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7ZirjZx2EecSKtcg5lDirg_Ef4Finpj';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   DATA / THEME
   ============================================================ */
const PALETTES = {
  rosa:    {a1:'#f3c9dc', a2:'#d9a6c2', a3:'#efe3d0', tx:'#3a2630'},
  ciruela: {a1:'#ddc6d8', a2:'#a97fa0', a3:'#efe3d0', tx:'#33212f'},
  verde:   {a1:'#d3dcbe', a2:'#93a875', a3:'#f1ecdd', tx:'#293423'},
  mostaza: {a1:'#f0d38a', a2:'#d4a441', a3:'#f7ecd8', tx:'#3a2c10'},
  celeste: {a1:'#c3dbe6', a2:'#7fa9bf', a3:'#eef3ee', tx:'#1f2f36'},
  topo:    {a1:'#dcd2c5', a2:'#a89a89', a3:'#f2ede4', tx:'#312a22'},
  lila:    {a1:'#d8c9e6', a2:'#a688c4', a3:'#efe6f3', tx:'#2c2436'},
  coral:   {a1:'#f2c9be', a2:'#d98d78', a3:'#f8ece2', tx:'#3a2018'}
};
const PALETTE_NAMES = {rosa:'Rosa', ciruela:'Ciruela', verde:'Verde salvia', mostaza:'Mostaza', celeste:'Celeste', topo:'Topo', lila:'Lila', coral:'Coral'};

/* ============================================================
   STATE
   ============================================================ */
let config = null;
let catalog = [];    // product rows straight from Supabase (each has .images: [url,...])
let orders = [];
let cart = [];        // [{id, qty}]
let view = 'loading'; // loading | home | section | admin-login | admin
let currentSection = null;
let adminAuthed = false;
let adminSession = null;
let adminTab = 'productos';
let productFormEdit = null;  // product row being edited, or 'new'
let productFormImages = [];  // public URLs already uploaded for the product being edited
let productFormPendingId = null; // temp id used for storage path before the row exists
let productFormVariants = []; // [{id, talle, color, quantity}]
let detailProduct = null;
let checkoutData = {name:'', phone:'', delivery:'retiro', payment:'efectivo', notes:''};
let lastOrderSummary = null;

/* ============================================================
   DATA LAYER (Supabase)
   ============================================================ */
async function loadAll(){
  const { data: cfgRow } = await sb.from('store_config').select('*').eq('id', 1).single();
  config = cfgRow ? {
    storeName: cfgRow.store_name, tagline: cfgRow.tagline, whatsapp: cfgRow.whatsapp,
    alias: cfgRow.alias, addressRef: cfgRow.address_ref, sections: cfgRow.sections || [],
    deliveryPickup: cfgRow.delivery_pickup || '', deliveryShipping: cfgRow.delivery_shipping || '',
    showroomInfo: cfgRow.showroom_info || '',
    paymentInfo: cfgRow.payment_info || 'Precios en efectivo o transferencia.',
    noReturnsInfo: cfgRow.no_returns_info || 'Sale por cierre y mudanza: no se aceptan cambios ni devoluciones.',
    freshStockInfo: cfgRow.fresh_stock_info || 'Siempre que entres vas a encontrar cosas nuevas — voy cargando el catálogo de a poco. ¡Hay muchísimo para ver, pasate seguido!',
    promos: cfgRow.promos || []
  } : { storeName:'Mi tienda', tagline:'', whatsapp:'', alias:'', addressRef:'', sections:[], deliveryPickup:'', deliveryShipping:'', showroomInfo:'', paymentInfo:'', noReturnsInfo:'', freshStockInfo:'', promos:[] };

  const { data: prodRows } = await sb.from('products').select('*').order('created_at', {ascending:true});
  catalog = (prodRows || []).map(r => ({
    id:r.id, sector:r.sector, subcategory:r.subcategory, name:r.name, description:r.description,
    estado:r.estado, material:r.material, medidas:r.medidas, price:r.price, quantity:r.quantity,
    stock:r.stock, images:r.images || [], variants:r.variants || []
  }));

function drawToDataUrl(source, srcW, srcH, maxW, quality){
  let w = srcW, h = srcH;
  if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(source, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}
async function fileToCompressedDataUrl(file, maxW=850, quality=0.68){
  // 1) intento rápido: el navegador decodifica el archivo directo (funciona con HEIC en algunos sistemas)
  if(window.createImageBitmap){
    try{
      const bitmap = await createImageBitmap(file, {imageOrientation:'from-image'});
      const url = drawToDataUrl(bitmap, bitmap.width, bitmap.height, maxW, quality);
      bitmap.close && bitmap.close();
      return url;
    }catch(e){ /* seguimos probando */ }
  }
  // 2) intento clásico vía <img> (jpg, png, webp, etc.)
  try{
    return await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=> resolve(drawToDataUrl(img, img.width, img.height, maxW, quality));
        img.onerror = ()=> reject(new Error('no decodable'));
        img.src = ev.target.result;
      };
      reader.onerror = ()=> reject(new Error('no decodable'));
      reader.readAsDataURL(file);
    });
  }catch(e){ /* seguimos probando */ }
  // 3) conversión HEIC específica vía heic2any
  const isHeic = file.type === 'image/heic' || file.type === 'image/heif' || /\.hei[cf]$/i.test(file.name||'');
  if(isHeic && window.heic2any){
    try{
      const converted = await heic2any({blob:file, toType:'image/jpeg', quality:0.85});
      const jpegBlob = Array.isArray(converted) ? converted[0] : converted;
      const bitmap = await createImageBitmap(jpegBlob);
      return drawToDataUrl(bitmap, bitmap.width, bitmap.height, maxW, quality);
    }catch(e){ console.error('heic2any falló', e); }
  }
  throw new Error('no se pudo procesar la imagen');
}
async function uploadProductImage(file, productId){
  try{
    const compressed = await Promise.race([
      fileToCompressedDataUrl(file),
      new Promise((_,rej)=> setTimeout(()=>rej(new Error('timeout')), 25000))
    ]);
    const blob = await (await fetch(compressed)).blob();
    const path = `${productId}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.jpg`;
    const { error } = await sb.storage.from('product-photos').upload(path, blob, { contentType:'image/jpeg' });
    if(error){ showToast('Error subiendo foto: ' + error.message); return null; }
    const { data } = sb.storage.from('product-photos').getPublicUrl(path);
    return data.publicUrl;
  }catch(err){
    // último recurso: subir el archivo tal cual, sin comprimir, para no bloquear la carga
    try{
      const path = `${productId}/${Date.now()}_${Math.random().toString(36).slice(2,7)}_${(file.name||'foto').replace(/[^a-zA-Z0-9.]/g,'')}`;
      const { error } = await sb.storage.from('product-photos').upload(path, file);
      if(error) throw error;
      const { data } = sb.storage.from('product-photos').getPublicUrl(path);
      showToast('Foto subida (puede tardar en mostrarse en algunos navegadores)');
      return data.publicUrl;
    }catch(e2){
      showToast('No se pudo subir esa foto. Probá enviártela por WhatsApp primero y subí esa versión.');
      return null;
    }
  }
}

async function updateOrderStock(items){
  for(const it of items){
    const p = catalog.find(x=>x.id===it.id);
    if(!p) continue;
    if(it.variantId){
      const variants = (p.variants||[]).map(v=> v.id===it.variantId ? {...v, quantity: Math.max(0, (v.quantity||0)-it.qty)} : v);
      const newStock = variants.some(v=>(v.quantity||0)>0);
      await sb.from('products').update({variants, stock:newStock}).eq('id', p.id);
      p.variants = variants; p.stock = newStock;
    }else{
      const newQty = Math.max(0, (p.quantity||1) - it.qty);
      const newStock = newQty > 0;
      await sb.from('products').update({quantity:newQty, stock:newStock}).eq('id', p.id);
      p.quantity = newQty; p.stock = newStock;
    }
  }
}

function compressImage(file, maxW=850, quality=0.68){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function cartKey(id, variantId){ return id + '::' + (variantId||''); }
function variantStock(p, variantId){
  if(!variantId) return Math.max(0, p.quantity||1);
  const v = (p.variants||[]).find(v=>v.id===variantId);
  return v ? Math.max(0, v.quantity||0) : 0;
}
function cartTotal(){
  return cart.reduce((sum, ci)=>{
    const p = catalog.find(x=>x.id===ci.id);
    return sum + (p ? p.price * ci.qty : 0);
  }, 0);
}
function cartCount(){ return cart.reduce((s,c)=>s+c.qty,0); }
function addToCart(id, variant, qty=1){
  const key = cartKey(id, variant && variant.id);
  const existing = cart.find(c=>cartKey(c.id,c.variantId)===key);
  if(existing) existing.qty += qty;
  else cart.push({id, variantId: variant ? variant.id : null, talle: variant ? variant.talle : null, color: variant ? variant.color : null, qty});
  showToast('Agregado al carrito ✓');
  render();
}
function setQty(key, qty){
  const it = cart.find(c=>cartKey(c.id,c.variantId)===key);
  if(!it) return;
  const p = catalog.find(x=>x.id===it.id);
  const max = p ? Math.max(1, variantStock(p, it.variantId)||1) : 99;
  it.qty = Math.max(1, Math.min(qty, max));
  render();
}
function removeFromCart(key){
  cart = cart.filter(c=>cartKey(c.id,c.variantId)!==key);
  render();
}

  if(view === 'admin-login'){ app.innerHTML = renderAdminLogin(); attachAdminLoginEvents(); return; }

  let html = renderTopbar();
  if(view === 'home') html += renderHome();
  else if(view === 'section') html += renderSectionPage();
  app.innerHTML = html;

  if(cartOpenFlag) renderCartOverlay();

        </div>

        <div class="qty-row">
          <button class="qty-btn" id="detail-qty-minus">−</button>
          <span id="detail-qty-val">1</span>
          <button class="qty-btn" id="detail-qty-plus">+</button>
        </div>
        <button class="primary-btn" id="detail-add" ${hasVariants?'disabled style="opacity:.5;"':''}>${hasVariants ? 'Elegí un talle primero' : 'Lo quiero — agregar al carrito'}</button>
      </div>
    </div>`;
  document.body.appendChild(container);
  container.querySelectorAll('[data-lightbox]').forEach(img=>{
    img.onclick = ()=> openLightbox(img.src);
  });
  let qty = 1;
  const addBtn = container.querySelector('#detail-add');
  const updateMax = ()=>{
    const maxQ = hasVariants ? (selectedVariant ? Math.max(1, selectedVariant.quantity||1) : 1) : Math.max(1, p.quantity||1);
    qty = Math.min(qty, maxQ);
    container.querySelector('#detail-qty-val').textContent = qty;
    return maxQ;
  };
  container.querySelector('#detail-close').onclick = ()=>{ detailProduct=null; container.remove(); };
  container.onclick = (e)=>{ if(e.target===container){ detailProduct=null; container.remove(); } };
  container.querySelector('#detail-qty-minus').onclick = ()=>{ qty=Math.max(1,qty-1); container.querySelector('#detail-qty-val').textContent=qty; };
  container.querySelector('#detail-qty-plus').onclick = ()=>{ const maxQ=updateMax(); qty=Math.min(maxQ,qty+1); container.querySelector('#detail-qty-val').textContent=qty; };
  if(hasVariants){
    container.querySelectorAll('[data-variant]').forEach(chip=>{
      chip.onclick = ()=>{
        selectedVariant = variants.find(v=>v.id===chip.dataset.variant);
        container.querySelectorAll('[data-variant]').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        qty = 1;
        updateMax();
        addBtn.disabled = false;
        addBtn.style.opacity = '1';
        addBtn.textContent = 'Lo quiero — agregar al carrito';
      };
    });
  }
  addBtn.onclick = ()=>{
    if(hasVariants && !selectedVariant) return;
    addToCart(p.id, selectedVariant, qty);
    detailProduct=null; container.remove();
  };
}

function renderCartOverlay(){
  const container = document.createElement('div');
  container.className = 'overlay';

  const items = cart.map(ci=>{
    const p = catalog.find(x=>x.id===ci.id);

    const img = p.images && p.images[0];
    const key = cartKey(ci.id, ci.variantId);

    return `<div class="cart-item">
      <img src="${img||''}" />
      <div class="cart-item-info">

          <button class="trash-btn" data-cartremove="${key}" style="margin-left:auto;">Quitar</button>
        </div>
      </div>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3>Tu carrito</h3><button class="close-x" id="cart-close">${ICONS.close}</button></div>
      ${cart.length===0 ? `<div class="empty-note">Todavía no agregaste nada. ¡Explorá las secciones!</div>` : `<div style="flex:1;">${items}</div>
      <div class="cart-footer">
        <div class="cart-total-row"><span>Total</span><span>${fmtPrice(cartTotal())}</span></div>
        <button class="primary-btn" id="btn-checkout">Continuar compra</button>
      </div>`}
    </div>`;
  document.body.appendChild(container);
  container.querySelector('#cart-close').onclick = ()=>{ cartOpenFlag=false; container.remove(); };
  container.onclick = (e)=>{ if(e.target===container){ cartOpenFlag=false; container.remove(); } };
  container.querySelectorAll('[data-cartplus]').forEach(b=> b.onclick = ()=>{ const it=cart.find(c=>cartKey(c.id,c.variantId)===b.dataset.cartplus); setQty(b.dataset.cartplus, it.qty+1); container.remove(); renderCartOverlay(); });
  container.querySelectorAll('[data-cartminus]').forEach(b=> b.onclick = ()=>{ const it=cart.find(c=>cartKey(c.id,c.variantId)===b.dataset.cartminus); setQty(b.dataset.cartminus, it.qty-1); container.remove(); renderCartOverlay(); });
  container.querySelectorAll('[data-cartremove]').forEach(b=> b.onclick = ()=>{ removeFromCart(b.dataset.cartremove); container.remove(); if(cart.length) renderCartOverlay(); else { cartOpenFlag=false; } });
  const chk = container.querySelector('#btn-checkout');
  if(chk) chk.onclick = ()=>{ cartOpenFlag=false; checkoutOpenFlag=true; container.remove(); renderCheckoutOverlay(); };
}

async function confirmOrder(){
  const items = cart.map(ci=>{
    const p = catalog.find(x=>x.id===ci.id);
    const variantLabel = [ci.talle, ci.color].filter(Boolean).join(' - ');
    return {id:ci.id, variantId: ci.variantId, name:p?productTitle(p):'—', variantLabel, price:p?p.price:0, qty:ci.qty};
  });
  const total = cartTotal();
  const order = {
    timestamp: new Date().toISOString(),
    buyer: {name: checkoutData.name, phone: checkoutData.phone},
    items, total,
    delivery: checkoutData.delivery, payment: checkoutData.payment,
    notes: checkoutData.notes
  };
  await insertOrder(order);
  await updateOrderStock(items);

  const lines = items.map(it=>`• ${it.qty}x ${it.name}${it.variantLabel?' ('+it.variantLabel+')':''} — ${fmtPrice(it.price*it.qty)}`).join('%0A');
  const msg = `Hola! Soy ${checkoutData.name}, quiero confirmar este pedido:%0A%0A${lines}%0A%0ATotal: ${fmtPrice(total)}%0AEntrega: ${checkoutData.delivery==='retiro'?'Retiro en Devoto':'Envío a coordinar'}%0APago: ${checkoutData.payment==='efectivo'?'Efectivo':'Transferencia'}${checkoutData.notes ? '%0ANotas: '+checkoutData.notes : ''}%0A%0AMi WhatsApp: ${checkoutData.phone}`;
  window.open(`https://wa.me/${config.whatsapp}?text=${msg}`, '_blank');

  lastOrderSummary = order;
  cart = [];
  checkoutOpenFlag = false;
  confirmScreenFlag = true;
  render();
}

function renderConfirmOverlay(){
  const container = document.createElement('div');
  container.className = 'overlay center';
  container.id = 'confirm-overlay';
  container.innerHTML = `
    <div class="sheet">

        <div style="font-size:44px;">🌸</div>
        <h2 style="font-family:'Poppins'; font-weight:400; font-size:22px;">¡Pedido enviado!</h2>

        </div>
        <div class="field"><label>Material</label><input id="pf-material" value="${p.material||''}" /></div>
        <div class="field"><label>Medidas (si aplica)</label><input id="pf-medidas" value="${p.medidas||''}" /></div>
        <div class="field"><label>Precio</label><input id="pf-price" type="number" value="${p.price||''}" /></div>
        <div class="field">
          <label id="pf-qty-label">${productFormVariants.length ? 'Cantidad (no se usa si hay variantes abajo)' : 'Cantidad disponible'}</label>
          <input id="pf-quantity" type="number" min="1" value="${p.quantity||1}" />
        </div>
        <div class="field">
          <label>Variantes de talle / color (opcional)</label>
          <div id="variant-rows"></div>
          <button class="ghost-btn" id="btn-add-variant" type="button">+ Agregar variante</button>
          <span style="font-size:11.5px; color:#a89a89;">Si cargás variantes, cada una tiene su propio stock y la clienta elige talle/color antes de comprar.</span>
        </div>
        <div class="field">
          <label>Fotos (podés elegir varias juntas)</label>
          <input id="pf-photos" type="file" accept="image/*" multiple />
          <div class="thumb-row" id="pf-thumbs"></div>
          <span id="pf-upload-status" style="font-size:11.5px; color:#a89a89;"></span>
        </div>
        <button class="primary-btn" id="pf-save">Guardar producto</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   ADMIN EVENTS
   ============================================================ */
function attachAdminEvents(){
  document.getElementById('admin-exit-store').onclick = goHome;
  document.getElementById('admin-logout').onclick = async ()=>{
    await sb.auth.signOut();
    adminAuthed=false; adminSession=null; orders=[];
    goHome();
  };
  document.querySelectorAll('.admin-tab').forEach(t=> t.onclick = ()=>{ adminTab=t.dataset.tab; render(); });

  if(adminTab==='productos'){
    const nb = document.getElementById('btn-new-product');
    if(nb) nb.onclick = ()=>{ productFormEdit='new'; productFormImages=[]; productFormVariants=[]; productFormPendingId=uid(); render(); };
    document.querySelectorAll('[data-editprod]').forEach(b=>{
      b.onclick = ()=>{
        const prod = catalog.find(x=>x.id===b.dataset.editprod);
        productFormEdit = prod;
        productFormImages = [...(prod.images||[])];
        productFormVariants = (prod.variants||[]).map(v=>({...v}));
        productFormPendingId = prod.id;
        render();
      };
    });
    document.querySelectorAll('[data-dupprod]').forEach(b=>{
      b.onclick = ()=>{
        const prod = catalog.find(x=>x.id===b.dataset.dupprod);
        productFormEdit = {...prod, _duplicate:true, name: prod.name + ' (copia)'};
        productFormImages = [...(prod.images||[])];
        productFormVariants = (prod.variants||[]).map(v=>({...v, id:uid()}));
        productFormPendingId = uid();
        render();
      };
    });
    document.querySelectorAll('[data-delprod]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('¿Eliminar este producto?')) return;
        await deleteProduct(b.dataset.delprod);
        catalog = catalog.filter(x=>x.id!==b.dataset.delprod);
        render();
      };
    });
    document.querySelectorAll('[data-stocktoggle]').forEach(b=>{
      b.onclick = async ()=>{
        const prod = catalog.find(x=>x.id===b.dataset.stocktoggle);
        prod.stock = !prod.stock;
        await toggleStock(prod.id, prod.stock);
        render();
      };
    });
  }

  if(adminTab==='pedidos'){
    document.querySelectorAll('[data-orderstatus]').forEach(sel=>{
      sel.onchange = async ()=>{
        const o = orders.find(x=>x.id===sel.dataset.orderstatus);
        o.status = sel.value;
        await sb.from('orders').update({status: sel.value}).eq('id', o.id);
        showToast('Estado actualizado');
      };
    });
  }

  if(adminTab==='config'){
    document.getElementById('btn-save-config').onclick = async ()=>{
      const ok = await saveConfigFields({
        storeName: document.getElementById('cfg-name').value.trim() || config.storeName,
        tagline: document.getElementById('cfg-tagline').value.trim(),
        whatsapp: document.getElementById('cfg-whatsapp').value.trim(),
        alias: document.getElementById('cfg-alias').value.trim(),
        addressRef: document.getElementById('cfg-address').value.trim(),
        deliveryPickup: document.getElementById('cfg-delivery-pickup').value.trim(),
        deliveryShipping: document.getElementById('cfg-delivery-shipping').value.trim(),
        showroomInfo: document.getElementById('cfg-showroom').value.trim(),
        paymentInfo: document.getElementById('cfg-payment').value.trim(),
        noReturnsInfo: document.getElementById('cfg-noreturns').value.trim(),
        freshStockInfo: document.getElementById('cfg-freshstock').value.trim()
      });
      if(ok){ showToast('Datos guardados'); render(); }
    };
    document.querySelectorAll('[data-delsection]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.delsection;
        const inUse = catalog.some(p=>p.sector===id);
        if(inUse){ showToast('Esa sección tiene productos, no se puede borrar'); return; }
        const newSections = config.sections.filter(s=>s.id!==id);
        const ok = await saveConfigFields({sections:newSections});
        if(ok) render();
      };
    });
    document.getElementById('btn-add-section').onclick = async ()=>{
      const label = document.getElementById('new-section-label').value.trim();
      const theme = document.getElementById('new-section-theme').value;
      if(!label){ showToast('Escribí un nombre para la sección'); return; }
      const id = label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid();
      const newSections = [...(config.sections||[]), {id, label, theme}];
      const ok = await saveConfigFields({sections:newSections});
      if(ok) render();
    };
    document.querySelectorAll('[data-delpromo]').forEach(b=>{
      b.onclick = async ()=>{
        const newPromos = (config.promos||[]).filter(pr=>pr.id!==b.dataset.delpromo);
        const ok = await saveConfigFields({promos:newPromos});
        if(ok) render();
      };
    });
    document.getElementById('btn-add-promo').onclick = async ()=>{
      const sector = document.getElementById('new-promo-sector').value;
      const label = document.getElementById('new-promo-label').value.trim();
      if(!label){ showToast('Escribí el texto de la promo'); return; }
      const newPromos = [...(config.promos||[]), {id:uid(), sector, label}];
      const ok = await saveConfigFields({promos:newPromos});
      if(ok) render();
    };
    document.getElementById('btn-save-password').onclick = async ()=>{
      const val = document.getElementById('cfg-password').value;
      if(!val || val.length<6){ showToast('Mínimo 6 caracteres'); return; }
      const { error } = await sb.auth.updateUser({ password: val });
      if(error){ showToast('Error: ' + error.message); return; }
      showToast('Contraseña actualizada');
      document.getElementById('cfg-password').value = '';
    };
  }

  const pf = document.getElementById('product-form-overlay');
  if(pf){
    const isNewProd = productFormEdit === 'new' || !!(productFormEdit && productFormEdit._duplicate);
    let currentEstado = (productFormEdit==='new') ? 'Usado' : productFormEdit.estado;
    document.getElementById('pf-close').onclick = ()=>{ productFormEdit=null; render(); };
    pf.onclick = (e)=>{ if(e.target===pf){ productFormEdit=null; render(); } };
    pf.querySelectorAll('[data-estado]').forEach(b=>{
      b.onclick = ()=>{ currentEstado = b.dataset.estado; pf.querySelectorAll('[data-estado]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    });

    // ---- thumbnails (added/removed without re-rendering the whole form) ----
    const thumbsEl = document.getElementById('pf-thumbs');
    function renderThumbs(){
      thumbsEl.innerHTML = '';
      productFormImages.forEach((url, idx)=>{
        const div = document.createElement('div');
        div.className = 'thumb';
        div.innerHTML = `
          <img src="${url}" />
          <div class="rm">✕</div>
          <div class="thumb-order">
            ${idx>0 ? `<button class="thumb-mv" data-dir="-1">◀</button>` : `<span></span>`}
            ${idx<productFormImages.length-1 ? `<button class="thumb-mv" data-dir="1">▶</button>` : `<span></span>`}
          </div>`;
        div.querySelector('.rm').onclick = ()=>{ productFormImages.splice(idx,1); renderThumbs(); };
        div.querySelectorAll('.thumb-mv').forEach(b=>{
          b.onclick = ()=>{
            const j = idx + Number(b.dataset.dir);
            [productFormImages[idx], productFormImages[j]] = [productFormImages[j], productFormImages[idx]];
            renderThumbs();
          };
        });
        thumbsEl.appendChild(div);
      });
    }
    renderThumbs();
    document.getElementById('pf-photos').onchange = async (e)=>{
      const files = Array.from(e.target.files);
      const statusEl = document.getElementById('pf-upload-status');
      const total = files.length;
      let completed = 0;
      statusEl.textContent = `Subiendo fotos... 0 de ${total}`;
      let nextIdx = 0;
      async function worker(){
        while(nextIdx < files.length){
          const file = files[nextIdx++];
          const url = await uploadProductImage(file, productFormPendingId);
          if(url){ productFormImages.push(url); renderThumbs(); }
          completed++;
          statusEl.textContent = `Subiendo fotos... ${completed} de ${total}`;
        }
      }
      await Promise.all(Array.from({length: Math.min(3, files.length)}, worker));
      statusEl.textContent = '';
      e.target.value = '';
    };

    // ---- variant rows (added/removed without re-rendering the whole form) ----
    const rowsEl = document.getElementById('variant-rows');
    const qtyLabel = document.getElementById('pf-qty-label');
    function updateQtyLabel(){
      qtyLabel.textContent = productFormVariants.length ? 'Cantidad (no se usa si hay variantes abajo)' : 'Cantidad disponible';
    }
    function addVariantRowEl(variant){
      const div = document.createElement('div');
      div.className = 'variant-row';
      div.innerHTML = `
        <input placeholder="Talle (ej: 38)" value="${variant.talle||''}" />
        <input placeholder="Color (opcional)" value="${variant.color||''}" />
        <input type="number" min="0" placeholder="Cant." style="max-width:70px;" value="${variant.quantity||0}" />
        <button class="icon-btn" type="button">✕</button>`;
      const [talleInp, colorInp, qtyInp] = div.querySelectorAll('input');
      talleInp.oninput = ()=>{ variant.talle = talleInp.value; };
      colorInp.oninput = ()=>{ variant.color = colorInp.value; };
      qtyInp.oninput = ()=>{ variant.quantity = Math.max(0, Number(qtyInp.value)||0); };
      div.querySelector('button').onclick = ()=>{
        const i = productFormVariants.indexOf(variant);
        if(i>-1) productFormVariants.splice(i,1);
        div.remove();
        updateQtyLabel();
      };
      rowsEl.appendChild(div);
    }
    productFormVariants.forEach(addVariantRowEl);
    document.getElementById('btn-add-variant').onclick = ()=>{
      const variant = {id:uid(), talle:'', color:'', quantity:1};
      productFormVariants.push(variant);
      addVariantRowEl(variant);
      updateQtyLabel();
    };

    document.getElementById('pf-save').onclick = async ()=>{
      const name = document.getElementById('pf-name').value.trim();
      const price = Number(document.getElementById('pf-price').value);
      if(!name || !price){ showToast('Completá al menos nombre y precio'); return; }
      const cleanVariants = productFormVariants.filter(v=>v.talle||v.color).map(v=>({id:v.id, talle:v.talle.trim(), color:(v.color||'').trim(), quantity:Math.max(0, Number(v.quantity)||0)}));
      const data = {
        sector: document.getElementById('pf-sector').value,
        subcategory: document.getElementById('pf-subcategory').value.trim(),
        name,
        description: document.getElementById('pf-description').value.trim(),
        estado: currentEstado,
        material: document.getElementById('pf-material').value.trim(),
        medidas: document.getElementById('pf-medidas').value.trim(),
        price,
        quantity: Math.max(1, Number(document.getElementById('pf-quantity').value)||1),
      };
      const existingId = isNewProd ? null : productFormEdit.id;
      const savedId = await saveProduct(data, productFormImages, cleanVariants, existingId);
      if(!savedId) return;
      if(existingId){
        Object.assign(productFormEdit, data, {images:[...productFormImages], variants:cleanVariants});
      }else{
        catalog.push({id:savedId, stock:true, ...data, images:[...productFormImages], variants:cleanVariants});
      }
      productFormEdit = null;
      productFormImages = [];
      productFormVariants = [];
      showToast('Producto guardado ✓');
      render();
    };
  }
}

/* ============================================================
   INIT
   ============================================================ */
loadAll();

</script>
