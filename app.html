const NUM_PALABRAS = {
  cero: 0, un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9,
  diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17,
  dieciocho: 18, diecinueve: 19, veinte: 20, veintiuno: 21, veinticinco: 25, treinta: 30, cuarenta: 40,
  cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90, cien: 100, ciento: 100,
  doscientos: 200, trescientos: 300, cuatrocientos: 400, quinientos: 500, seiscientos: 600,
  setecientos: 700, ochocientos: 800, novecientos: 900,
};

const sinAcentos = (s) =>
  String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

// Saca el monto de la frase: acepta "4000", "4.000", "4 mil", "cuatro mil", "cuatro mil quinientos"
const extraerMonto = (texto) => {
  const t = sinAcentos(texto);

  // 1) Número escrito con dígitos, con o sin "mil" detrás
  const conDigitos = t.match(/(\d+(?:[.,]\d+)?)\s*(mil|lucas|palos)?/);
  if (conDigitos) {
    let n = parseFloat(conDigitos[1].replace(/\./g, "").replace(",", "."));
    if (conDigitos[2] === "mil" || conDigitos[2] === "lucas") n *= 1000;
    if (conDigitos[2] === "palos") n *= 1000000;
    if (!isNaN(n) && n > 0) return n;
  }

  // 2) Número en palabras
  const palabras = t.split(/\s+/);
  let total = 0, actual = 0, encontro = false;
  for (const p of palabras) {
    if (p in NUM_PALABRAS) { actual += NUM_PALABRAS[p]; encontro = true; }
    else if (p === "mil") { actual = (actual || 1) * 1000; total += actual; actual = 0; encontro = true; }
    else if (p === "millon" || p === "millones") { actual = (actual || 1) * 1000000; total += actual; actual = 0; encontro = true; }
    else if (p === "y") { /* seguir acumulando: "cuarenta y cinco" */ }
    else if (encontro && actual + total > 0) break;
  }
  const n = total + actual;
  return encontro && n > 0 ? n : NaN;
};

// Busca a qué cuenta se refiere la frase
const detectarCuenta = (texto, cuentas) => {
  const t = sinAcentos(texto);
  let mejor = null, mejorPuntaje = 0;
  cuentas.forEach((c) => {
    const candidatos = [c.entidad, c.nombre, `${c.entidad} ${c.nombre}`];
    candidatos.forEach((cand) => {
      const palabras = sinAcentos(cand).split(/\s+/).filter((w) => w.length > 3);
      const aciertos = palabras.filter((w) => t.includes(w)).length;
      if (aciertos > mejorPuntaje) { mejorPuntaje = aciertos; mejor = c; }
    });
  });
  return mejor;
};

// Busca grupo + categoría mencionados
const detectarCategoria = (texto, grupos) => {
  const t = sinAcentos(texto);
  let mejor = null, mejorLargo = 0;
  grupos.forEach((g) => {
    g.categorias.forEach((cat) => {
      const limpia = sinAcentos(cat).replace(/[^a-z0-9\s]/g, " ");
      limpia.split(/\s+/).filter((w) => w.length > 3).forEach((w) => {
        if (t.includes(w) && w.length > mejorLargo) { mejorLargo = w.length; mejor = { grupo: g.nombre, categoria: cat }; }
      });
    });
  });
  return mejor;
};

const detectarTipo = (texto) => {
  const t = sinAcentos(texto);
  if (/\b(cobre|cobra|ingreso|ingrese|entro|entraron|me pagaron|vendi|recibi|gane)\b/.test(t)) return "ingreso";
  if (/\b(transferi|pase|cambie|moví|movi)\b/.test(t)) return "transfer";
  return "gasto";
};

// ————— Ciclo real de una tarjeta —————
// El vencimiento SIEMPRE cae después del cierre. Si el día de vencimiento es
// menor que el de cierre (ej: cierra 20, vence 3), el vencimiento es del mes siguiente.
const fechaConDia = (anio, mes, dia) => {
  const ultimo = new Date(anio, mes + 1, 0).getDate();
  return new Date(anio, mes, Math.min(dia, ultimo));
};

const cicloTarjeta = (tarjeta) => {
  if (!tarjeta.cierreDia) return null;
  const ahora = new Date();
  const hoyD = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());

  // Próximo cierre: este mes si todavía no pasó, si no el que viene
  let cierre = fechaConDia(ahora.getFullYear(), ahora.getMonth(), tarjeta.cierreDia);
  if (cierre < hoyD) cierre = fechaConDia(ahora.getFullYear(), ahora.getMonth() + 1, tarjeta.cierreDia);

  // Cierre anterior
  const cierreAnterior = fechaConDia(cierre.getFullYear(), cierre.getMonth() - 1, tarjeta.cierreDia);

  const vencDe = (fCierre) => {
    if (!tarjeta.venceDia) return null;
    const mismoMes = tarjeta.venceDia > tarjeta.cierreDia;
    return fechaConDia(fCierre.getFullYear(), fCierre.getMonth() + (mismoMes ? 0 : 1), tarjeta.venceDia);
  };

  const diffDias = (f) => Math.round((f - hoyD) / 86400000);

  return {
    cierre,
    vencimiento: vencDe(cierre),
    vencimientoAnterior: vencDe(cierreAnterior),
    diasACierre: diffDias(cierre),
    diasAVencimiento: vencDe(cierre) ? diffDias(vencDe(cierre)) : null,
  };
};

const fmtFechaLarga = (f) => (f ? `${f.getDate()} de ${MESES[f.getMonth()].toLowerCase()}` : "—");

// ¿Está vencida? Solo lo afirmamos cuando tenemos certeza: pasó el vencimiento
// del ciclo anterior, hay deuda, HAY consumos de ese ciclo, y no hay ningún
// pago registrado ni marca manual de "ya la pagué". Ante la duda, no avisamos:
// un cartel de VENCIDO equivocado es peor que no avisar.
const tarjetaVencida = (tarjeta, data, deuda) => {
  const c = cicloTarjeta(tarjeta);
  if (!c || !c.vencimientoAnterior) return false;
  const hayDeuda = deuda && (deuda.ARS > 0 || deuda.USD > 0);
  if (!hayDeuda) return false;

  const ahora = new Date();
  const hoyD = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  if (hoyD <= c.vencimientoAnterior) return false;

  const iso = (f) => `${f.getFullYear()}-${String(f.getMonth() + 1).padStart(2, "0")}-${String(f.getDate()).padStart(2, "0")}`;
  const cierreAnterior = fechaConDia(c.cierre.getFullYear(), c.cierre.getMonth() - 1, tarjeta.cierreDia);
  const cierreDosAtras = fechaConDia(c.cierre.getFullYear(), c.cierre.getMonth() - 2, tarjeta.cierreDia);

  // Si marcó "ya la pagué" después del cierre anterior, está al día
  if (tarjeta.pagadaHasta && tarjeta.pagadaHasta >= iso(cierreDosAtras)) return false;

  // Si registró algún pago desde el cierre de dos ciclos atrás, está al día
  const hayPago = data.movs.some(
    (m) => m.tipo === "transfer" && m.cuentaDestinoId === tarjeta.id && m.fecha >= iso(cierreDosAtras)
  );
  if (hayPago) return false;

  // Solo avisamos si hay consumos cargados de ESE ciclo (si no, no sabemos nada)
  const consumosDelCiclo = data.movs.some(
    (m) => m.tipo === "gasto" && m.cuentaId === tarjeta.id &&
           m.fecha >= iso(cierreDosAtras) && m.fecha < iso(cierreAnterior)
  );
  return consumosDelCiclo;
};

function Root() {
  const [session, setSession] = useState(null);
  const [listo, setListo] = useState(false);

  useEffect(() => {
    if (!sb) { setListo(true); return; }
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setListo(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_ev, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (!configLista) return <PantallaConfig />;
  if (!listo) return <PantallaCentrada texto="Abriendo tu cuaderno…" />;
  if (!session) return <Login />;
  return <MisFinanzas session={session} />;
}

        const { data, error: e } = await sb.auth.signUp({ email: email.trim(), password: pass });
        if (e) throw e;
        if (!data.session) {
          setMensaje("¡Cuenta creada! Revisá tu email para confirmarla y después ingresá.");
        }
      } else {
        const { error: e } = await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
        if (e) throw e;
      }
    } catch (e) {
      const msg = String(e.message || e);
      setError(
        msg.includes("Invalid login") ? "Email o contraseña incorrectos." :
        msg.includes("already registered") ? "Ese email ya tiene cuenta — probá ingresar." :
        msg.includes("Email not confirmed") ? "Tu email todavía no está confirmado — revisá tu casilla." :
        "No se pudo completar: " + msg
      );
    }
    setCargando(false);
  };

  return (
    <div style={{ ...S.app, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ ...S.card, width: "100%", maxWidth: 380 }}>
        <div style={S.eyebrow}>Cuaderno de finanzas</div>
        <h2 style={{ margin: "6px 0 16px", color: C.tinta, fontSize: 24 }}>
          {modo === "ingresar" ? "Hola de nuevo 💜" : "Crear tu cuenta"}
        </h2>

        <label style={{ ...S.label, marginTop: 0 }}>Email</label>
        <input style={S.input} type="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tu@email.com" />

        <label style={{ ...S.label, marginTop: 0 }}>Contraseña</label>
        <input
          style={S.input}
          type="password"
          autoComplete={modo === "crear" ? "new-password" : "current-password"}
          value={pass}
          onChange={(e) => setPass(e.target.value)}
          placeholder="Mínimo 6 caracteres"
          onKeyDown={(e) => e.key === "Enter" && enviar()}
        />

        {error && <div style={{ fontSize: 13, color: C.gasto, marginBottom: 10 }}>{error}</div>}
        {mensaje && <div style={{ fontSize: 13, color: C.ingreso, marginBottom: 10 }}>{mensaje}</div>}

        <button style={{ ...S.btnPrimario, marginTop: 4, opacity: cargando ? 0.6 : 1 }} onClick={enviar} disabled={cargando}>
          {cargando ? "Un momento…" : modo === "ingresar" ? "Ingresar" : "Crear cuenta"}
        </button>

        <button
          style={{ ...S.btnFantasma, width: "100%", textAlign: "center", marginTop: 8 }}
          onClick={() => { setModo(modo === "ingresar" ? "crear" : "ingresar"); setError(""); setMensaje(""); }}
        >
          {modo === "ingresar" ? "¿Primera vez? Crear cuenta" : "Ya tengo cuenta — ingresar"}
        </button>
      </div>
    </div>
  );
}

// ————— App principal —————
function MisFinanzas({ session }) {
  const [data, setData] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [errorCarga, setErrorCarga] = useState(false);
  const [errorStorage, setErrorStorage] = useState(false);
  const [tab, setTab] = useState("inicio");
  const [aviso, setAviso] = useState("");

  const cargarDatos = async () => {
    setCargando(true);
    setErrorCarga(false);
    try {
      const { data: fila, error } = await sb
        .from("finanzas")
        .select("data")
        .eq("user_id", session.user.id)
        .maybeSingle();
      if (error) throw error;
      // Solo usamos datos iniciales si la consulta FUNCIONÓ y confirmó que no hay nada guardado.
      // Si la consulta falla, NUNCA pisamos tus datos: mostramos error y reintentás.
      setData(fila && fila.data ? fila.data : datosIniciales());
    } catch (e) {
      setErrorCarga(true);
    }
    setCargando(false);
  };

  useEffect(() => { cargarDatos(); }, [session.user.id]);

  const guardar = async (nuevo) => {
    setData(nuevo);
    try {
      const { error } = await sb.from("finanzas").upsert({
        user_id: session.user.id,
        data: nuevo,
        updated_at: new Date().toISOString(),
      });
      if (error) throw error;
      setErrorStorage(false);
    } catch (e) {
      setErrorStorage(true);
    }
  };

  const salir = () => sb.auth.signOut();

  const avisar = (msg) => {
    setAviso(msg);
    setTimeout(() => setAviso(""), 2400);
  };

  const balances = useMemo(() => {
    if (!data) return {};
    const b = {};
    data.cuentas.forEach((c) => { if (c.clase !== "credito") b[c.id] = c.inicial || 0; });
    data.movs.forEach((m) => {
      const esNoCredito = (id) => id in b;
      if (m.tipo === "ingreso" && esNoCredito(m.cuentaId)) b[m.cuentaId] += m.monto;
      if (m.tipo === "gasto" && esNoCredito(m.cuentaId)) b[m.cuentaId] -= m.monto;
      if (m.tipo === "transfer") {
        if (esNoCredito(m.cuentaId)) b[m.cuentaId] -= m.monto;
        if (esNoCredito(m.cuentaDestinoId)) b[m.cuentaDestinoId] += (m.montoDestino != null ? m.montoDestino : m.monto);
      }
    });
    return b;
  }, [data]);

  const deudasTarjetas = useMemo(() => (data ? calcularDeudasTarjetas(data) : {}), [data]);

  if (cargando) return <PantallaCentrada texto="Abriendo tu cuaderno…" />;

  if (errorCarga) {
    return (
      <div style={{ ...S.app, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
        <div style={{ ...S.card, maxWidth: 380, textAlign: "center" }}>
          <div style={{ fontSize: 15, color: C.tinta, fontWeight: 600, marginBottom: 6 }}>No pudimos traer tus datos</div>
          <div style={{ fontSize: 13.5, color: C.tintaSuave, marginBottom: 14, lineHeight: 1.5 }}>
            Tranquila: tus datos están a salvo en la nube. Suele ser un tema de conexión.
          </div>
          <button style={S.btnPrimario} onClick={cargarDatos}>Reintentar</button>
        </div>
      </div>
    );
  }

  const titulos = { inicio: "Hoy", fijos: "Fijos del mes", tarjetas: "Tus tarjetas", resumen: "Resumen", historial: "Historial", cuentas: "Tus cuentas" };

  return (
    <div style={S.app}>
      <div style={S.marco}>
        <header style={S.header}>
          <div>
            <div style={S.eyebrow}>{fechaLarga()}</div>
            <h1 style={S.titulo}>{titulos[tab]}</h1>
          </div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
            {errorStorage && <div style={S.badgeError}>Sin guardar — revisá conexión</div>}
            <button style={S.btnMini} onClick={salir}>cerrar sesión</button>
          </div>
        </header>

        {tab === "inicio" && <Inicio data={data} balances={balances} deudasTarjetas={deudasTarjetas} guardar={guardar} avisar={avisar} />}
        {tab === "fijos" && <Fijos data={data} guardar={guardar} avisar={avisar} />}
        {tab === "tarjetas" && <Tarjetas data={data} deudasTarjetas={deudasTarjetas} guardar={guardar} avisar={avisar} />}
        {tab === "resumen" && <Resumen data={data} />}
        {tab === "historial" && <Historial data={data} guardar={guardar} avisar={avisar} />}
        {tab === "cuentas" && <Cuentas data={data} balances={balances} deudasTarjetas={deudasTarjetas} guardar={guardar} avisar={avisar} />}

        <nav style={S.nav}>
          {[["inicio", "Inicio"], ["fijos", "Fijos"], ["tarjetas", "Tarjetas"], ["resumen", "Resumen"], ["historial", "Historial"], ["cuentas", "Cuentas"]].map(([k, label]) => (
            <button
              key={k}
              onClick={() => setTab(k)}
              style={{
                ...S.navBtn,
                color: tab === k ? C.lavOscuro : C.gris,
                borderTop: tab === k ? `2px solid ${C.lav}` : "2px solid transparent",
                fontWeight: tab === k ? 700 : 500,
              }}
            >
              {label}
            </button>
          ))}
        </nav>

        {aviso && <div style={S.toast}>{aviso}</div>}
      </div>
    </div>
  );
}

// ————— Inicio —————
function Inicio({ data, balances, deudasTarjetas, guardar, avisar }) {
  const totales = useMemo(() => {
    const t = { disponible: { ARS: 0, USD: 0 }, tarjetas: { ARS: 0, USD: 0 } };
    data.cuentas.forEach((c) => {
      if (c.clase === "credito") {
        const d = deudasTarjetas[c.id] || { ARS: 0, USD: 0 };
        if (d.ARS > 0) t.tarjetas.ARS += d.ARS;
        if (d.USD > 0) t.tarjetas.USD += d.USD;
      } else {
        t.disponible[c.moneda] += balances[c.id] || 0;
      }
    });
    return t;
  }, [data, balances, deudasTarjetas]);

  const mes = mesActual();
  const fijosPagados = data.fijos.filter((f) => movQuePagaFijo(data, f, mes)).length;
  const fijosTotal = data.fijos.length;

  return (
    <div style={{ paddingBottom: 90 }}>
      <div style={{ ...S.card, background: `linear-gradient(135deg, ${C.lavOscuro}, ${C.lav})`, border: "none" }}>
        <div style={{ display: "flex", gap: 28, flexWrap: "wrap" }}>
          {["ARS", "USD"].map((mon) => (
            <div key={mon}>
              <div style={{ fontSize: 12, color: "#CFC7E4", letterSpacing: "0.06em", textTransform: "uppercase" }}>
                {mon === "ARS" ? "Pesos" : "Dólares"}
              </div>
              <div style={{ fontSize: 28, fontWeight: 700, color: "#fff", fontVariantNumeric: "tabular-nums", letterSpacing: "-0.02em" }}>
                {fmt(totales.disponible[mon], mon)}
              </div>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 20, marginTop: 14, paddingTop: 12, borderTop: "1px solid rgba(255,255,255,0.18)", flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: 11, color: "#CFC7E4" }}>Deuda de tarjetas</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: "#F3D3DD", fontVariantNumeric: "tabular-nums" }}>
              {totales.tarjetas.ARS <= 0 && totales.tarjetas.USD <= 0
                ? "Al día ✓"
                : [totales.tarjetas.ARS > 0 && fmt(totales.tarjetas.ARS, "ARS"), totales.tarjetas.USD > 0 && fmt(totales.tarjetas.USD, "USD")].filter(Boolean).join(" · ")}
            </div>
          </div>
          <div>
            <div style={{ fontSize: 11, color: "#CFC7E4" }}>Fijos del mes</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: fijosPagados === fijosTotal ? "#C8E6D2" : "#F0E2B8" }}>
              {fijosPagados} de {fijosTotal} pagados
            </div>
          </div>
        </div>
      </div>

      <Vencidos data={data} deudasTarjetas={deudasTarjetas} />

      <CargaRapida data={data} guardar={guardar} avisar={avisar} />
    </div>
  );
}

// ————— Cartel de vencidos —————
function Vencidos({ data, deudasTarjetas }) {
  const mes = mesActual();

  const fijosVencidos = data.fijos.filter(
    (f) => f.venceDia && !movQuePagaFijo(data, f, mes) && diaHoy() > f.venceDia
  );

  const tieneDeuda = (id) => {
    const d = deudasTarjetas[id] || { ARS: 0, USD: 0 };
    return d.ARS > 0 || d.USD > 0;
  };

  const tarjetasVencidas = data.cuentas.filter(
    (c) => c.clase === "credito" && tarjetaVencida(c, data, deudasTarjetas[c.id])
  );

  const proximos = data.fijos.filter(
    (f) => f.venceDia && !movQuePagaFijo(data, f, mes) && diaHoy() <= f.venceDia && f.venceDia - diaHoy() <= 3
  );

  if (fijosVencidos.length === 0 && tarjetasVencidas.length === 0 && proximos.length === 0) return null;

  const deudaTexto = (id, moneda) => {
    const d = deudasTarjetas[id] || { ARS: 0, USD: 0 };
    return [d.ARS > 0 && fmt(d.ARS, "ARS"), d.USD > 0 && fmt(d.USD, "USD")].filter(Boolean).join(" + ");
  };

  return (
    <div style={{ ...S.card, borderLeft: `4px solid ${fijosVencidos.length || tarjetasVencidas.length ? C.gasto : C.ambar}` }}>
      {(fijosVencidos.length > 0 || tarjetasVencidas.length > 0) && (
        <div style={{ marginBottom: proximos.length ? 10 : 0 }}>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: C.gasto, marginBottom: 6 }}>
            ⚠ Vencidos
          </div>
          {fijosVencidos.map((f) => (
            <div key={f.id} style={{ fontSize: 13.5, color: C.tinta, marginBottom: 3 }}>
              <b>{f.categoria}</b> <span style={{ color: C.gris }}>— venció el {f.venceDia}</span>
            </div>
          ))}
          {tarjetasVencidas.map((c) => {
            const ci = cicloTarjeta(c);
            return (
              <div key={c.id} style={{ fontSize: 13.5, color: C.tinta, marginBottom: 3 }}>
                <b>{etiquetaCuenta(c)}</b> <span style={{ color: C.gris }}>— venció el {fmtFechaLarga(ci && ci.vencimientoAnterior)} · debés {deudaTexto(c.id)}</span>
              </div>
            );
          })}
        </div>
      )}
      {proximos.length > 0 && (
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: C.ambar, marginBottom: 6 }}>
            Vencen pronto
          </div>
          {proximos.map((f) => (
            <div key={f.id} style={{ fontSize: 13.5, color: C.tinta, marginBottom: 3 }}>
              <b>{f.categoria}</b> <span style={{ color: C.gris }}>— {f.venceDia === diaHoy() ? "vence hoy" : `vence el ${f.venceDia}`}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ————— Carga rápida —————
function CargaRapida({ data, guardar, avisar }) {
  const [tipo, setTipo] = useState("gasto");
  const [monto, setMonto] = useState("");
  const [cuentaId, setCuentaId] = useState("");
  const [cuentaDestinoId, setCuentaDestinoId] = useState("");
  const [montoDestino, setMontoDestino] = useState("");
  const [grupo, setGrupo] = useState("Diarios");
  const [categoria, setCategoria] = useState("");
  const [nota, setNota] = useState("");
  const [fecha, setFecha] = useState(hoy());
  const [masOpciones, setMasOpciones] = useState(false);
  const [monedaTarjeta, setMonedaTarjeta] = useState("");
  const [cuotas, setCuotas] = useState(1);
  const [cuotasOtro, setCuotasOtro] = useState("");
  const [cuotasYaPagas, setCuotasYaPagas] = useState("");
  const [escuchando, setEscuchando] = useState(false);
  const [dictado, setDictado] = useState("");
  const [errorVoz, setErrorVoz] = useState("");
  const recRef = useRef(null);

  const hayVoz = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  const aplicarDictado = (frase) => {
    setDictado(frase);
    const t = detectarTipo(frase);
    setTipo(t);

    const m = extraerMonto(frase);
    if (!isNaN(m)) setMonto(String(m));

    const c = detectarCuenta(frase, data.cuentas);
    if (c) setCuentaId(c.id);

    if (t === "gasto") {
      const cat = detectarCategoria(frase, data.grupos.filter((g) => g.nombre !== "Ingresos"));
      if (cat) { setGrupo(cat.grupo); setCategoria(cat.categoria); }
    } else if (t === "ingreso") {
      const cat = detectarCategoria(frase, data.grupos.filter((g) => g.nombre === "Ingresos"));
      if (cat) setCategoria(cat.categoria);
    }

    setNota(frase);
    setMasOpciones(true);
    setFecha(hoy());
  };

  const escuchar = () => {
    setErrorVoz("");
    if (!hayVoz) {
      setErrorVoz("Tu navegador no permite dictado. Probá con Chrome, o usá el micrófono del teclado escribiendo en la nota.");
      return;
    }
    if (escuchando && recRef.current) { recRef.current.stop(); return; }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    recRef.current = rec;
    rec.lang = "es-AR";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (ev) => {
      const frase = ev.results[0][0].transcript;
      aplicarDictado(frase);
    };
    rec.onerror = (ev) => {
      setErrorVoz(
        ev.error === "not-allowed" ? "Necesito permiso para usar el micrófono. Habilitalo en el candado de la barra de direcciones."
        : ev.error === "no-speech" ? "No te escuché. Probá de nuevo."
        : "No se pudo escuchar: " + ev.error
      );
      setEscuchando(false);
    };
    rec.onend = () => setEscuchando(false);
    try { rec.start(); setEscuchando(true); } catch (e) { setErrorVoz("No se pudo abrir el micrófono."); }
  };

  const cta = data.cuentas.find((c) => c.id === cuentaId);
  const ctaDestino = data.cuentas.find((c) => c.id === cuentaDestinoId);
  const cruzaMoneda = tipo === "transfer" && cta && ctaDestino && cta.moneda !== ctaDestino.moneda;
  const colorTipo = tipo === "gasto" ? C.gasto : tipo === "ingreso" ? C.ingreso : C.transfer;
  const esTarjeta = cta && cta.clase === "credito";
  const monedaGasto = esTarjeta ? (monedaTarjeta || cta.moneda) : (cta ? cta.moneda : "ARS");
  const nCuotas = cuotas === "otro" ? parseInt(cuotasOtro, 10) || 0 : cuotas;

  const gruposGasto = data.grupos.filter((g) => g.nombre !== "Ingresos" && g.nombre !== "Tarjetas");
  const catsIngreso = (data.grupos.find((g) => g.nombre === "Ingresos") || { categorias: [] }).categorias;
  const catsDelGrupo = (data.grupos.find((g) => g.nombre === grupo) || { categorias: [] }).categorias;

  const puedeGuardar = () => {
    const m = parseMonto(monto);
    if (isNaN(m) || m <= 0 || !cuentaId) return false;
    if (tipo === "gasto" && !categoria) return false;
    if (tipo === "gasto" && esTarjeta && nCuotas < 1) return false;
    if (tipo === "transfer") {
      if (!cuentaDestinoId || cuentaDestinoId === cuentaId) return false;
      if (cruzaMoneda && (isNaN(parseMonto(montoDestino)) || parseMonto(montoDestino) <= 0)) return false;
    }
    return true;
  };

  const guardarMov = () => {
    if (!puedeGuardar()) return;
    const m = parseMonto(monto);
    const nuevosMovs = [];

    if (tipo === "gasto" && esTarjeta && nCuotas > 1) {
      // Compra en cuotas: un movimiento por mes, cada uno por monto/cuotas.
      // Si ya pagaste algunas, la primera cuota se ubica hacia atrás para que
      // el historial y el acumulado queden fieles a la realidad.
      const yaPagas = Math.max(0, Math.min(parseInt(cuotasYaPagas, 10) || 0, nCuotas - 1));
      const porCuota = Math.round((m / nCuotas) * 100) / 100;
      const compraId = uid();
      let acumulado = 0;
      for (let i = 1; i <= nCuotas; i++) {
        const montoCuota = i === nCuotas ? Math.round((m - acumulado) * 100) / 100 : porCuota;
        acumulado += montoCuota;
        nuevosMovs.push({
          id: uid() + i,
          tipo: "gasto",
          monto: montoCuota,
          cuentaId,
          fecha: sumarMeses(fecha, i - 1 - yaPagas),
          nota: `${nota.trim() ? nota.trim() + " " : ""}(cuota ${i}/${nCuotas})`,
          grupo,
          categoria,
          monedaMov: monedaGasto,
          cuotasTotal: nCuotas,
          cuotaNum: i,
          compraId,
          compraNombre: nota.trim() || categoria,
        });
      }
    } else {
      const mov = {
        id: uid(),
        tipo,
        monto: m,
        cuentaId,
        fecha,
        nota: nota.trim(),
        grupo: tipo === "gasto" ? grupo : tipo === "ingreso" ? "Ingresos" : "Transferencias",
        categoria: tipo === "gasto" ? categoria : tipo === "ingreso" ? (categoria || "Otros ingresos") : "Transferencia",
      };
      if (tipo === "gasto" && esTarjeta) mov.monedaMov = monedaGasto;
      if (tipo === "transfer") {
        mov.cuentaDestinoId = cuentaDestinoId;
        if (cruzaMoneda) mov.montoDestino = parseMonto(montoDestino);
      }
      nuevosMovs.push(mov);
    }

    guardar({ ...data, movs: [...nuevosMovs, ...data.movs] });
    setMonto(""); setNota(""); setMontoDestino(""); setFecha(hoy()); setCuotas(1); setCuotasOtro("");
    avisar(
      tipo === "gasto" && esTarjeta && nCuotas > 1 ? `${fmt(m, monedaGasto)} en ${nCuotas} cuotas anotado ✓`
      : tipo === "gasto" ? `Gasto de ${fmt(m, monedaGasto)} anotado ✓`
      : tipo === "ingreso" ? `Ingreso de ${fmt(m, cta.moneda)} anotado ✓`
      : "Movimiento entre cajas anotado ✓"
    );
  };

  return (
    <div style={{ ...S.card, borderTop: `3px solid ${colorTipo}` }}>
      <button
        style={{
          ...S.btnVoz,
          background: escuchando ? C.gasto : C.lavSuave,
          color: escuchando ? "#fff" : C.lavOscuro,
        }}
        onClick={escuchar}
      >
        {escuchando ? "🎙 Escuchando… tocá para parar" : "🎙 Dictar el movimiento"}
      </button>

      {dictado && (
        <div style={{ fontSize: 12.5, color: C.tintaSuave, background: C.lavSuave, padding: "8px 10px", borderRadius: 8, marginBottom: 10, lineHeight: 1.45 }}>
          Escuché: <i>"{dictado}"</i><br />
          <span style={{ color: C.gris }}>Revisá lo que completé abajo y tocá Anotar.</span>
        </div>
      )}
      {errorVoz && <div style={{ fontSize: 12.5, color: C.gasto, marginBottom: 10, lineHeight: 1.45 }}>{errorVoz}</div>}

      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {[["gasto", "Gasto"], ["ingreso", "Ingreso"], ["transfer", "Entre cajas"]].map(([k, label]) => (
          <button
            key={k}
            onClick={() => { setTipo(k); setCategoria(""); }}
            style={{
              ...S.tipoBtn,
              background: tipo === k ? (k === "gasto" ? C.gastoSuave : k === "ingreso" ? C.ingresoSuave : C.transferSuave) : "transparent",
              color: tipo === k ? (k === "gasto" ? C.gasto : k === "ingreso" ? C.ingreso : C.transfer) : C.gris,
              borderColor: tipo === k ? "transparent" : C.linea,
              fontWeight: tipo === k ? 700 : 500,
            }}
          >
            {label}
          </button>
        ))}
      </div>

      <input
        style={{ ...S.inputMonto, color: colorTipo }}
        inputMode="decimal"
        placeholder="¿Cuánto?"
        value={monto}
        onChange={(e) => setMonto(e.target.value)}
      />

      <label style={S.label}>
        {tipo === "transfer" ? "Desde" : tipo === "ingreso" ? "Entra a" : "Sale de (cuenta o tarjeta)"}
      </label>
      <div style={S.chips}>
        {data.cuentas.map((c) => (
          <Chip key={c.id} activo={cuentaId === c.id} dot={colorEntidad(c.entidad)} onClick={() => { setCuentaId(c.id); setMonedaTarjeta(""); setCuotas(1); }}>
            {etiquetaCuenta(c)}
          </Chip>
        ))}
      </div>

      {tipo === "gasto" && esTarjeta && (
        <React.Fragment>
          <label style={S.label}>¿En qué moneda es el consumo?</label>
          <div style={S.chips}>
            <Chip activo={monedaGasto === "ARS"} onClick={() => setMonedaTarjeta("ARS")}>Pesos</Chip>
            <Chip activo={monedaGasto === "USD"} onClick={() => setMonedaTarjeta("USD")}>Dólares</Chip>
          </div>
          <label style={S.label}>¿En cuotas?</label>
          <div style={S.chips}>
            {[1, 3, 6, 12].map((n) => (
              <Chip key={n} activo={cuotas === n} onClick={() => { setCuotas(n); setCuotasOtro(""); }}>
                {n === 1 ? "Un pago" : `${n} cuotas`}
              </Chip>
            ))}
            <Chip activo={cuotas === "otro"} onClick={() => setCuotas("otro")}>Otra cantidad</Chip>
          </div>
          {cuotas === "otro" && (
            <input
              style={{ ...S.input, marginTop: 6 }}
              inputMode="numeric"
              placeholder="¿Cuántas cuotas?"
              value={cuotasOtro}
              onChange={(e) => setCuotasOtro(e.target.value)}
            />
          )}
          {nCuotas > 1 && (
            <React.Fragment>
              <label style={S.label}>¿Ya venís pagando cuotas de antes? (opcional)</label>
              <input
                style={S.input}
                inputMode="numeric"
                placeholder="¿Cuántas cuotas ya pagaste? Dejá vacío si arranca ahora"
                value={cuotasYaPagas}
                onChange={(e) => setCuotasYaPagas(e.target.value)}
              />
            </React.Fragment>
          )}
          {nCuotas > 1 && parseMonto(monto) > 0 && (
            <div style={{ fontSize: 12.5, color: C.tintaSuave, marginTop: 2, lineHeight: 1.5 }}>
              {(() => {
                const ya = Math.max(0, Math.min(parseInt(cuotasYaPagas, 10) || 0, nCuotas - 1));
                const cuota = fmt(Math.round((parseMonto(monto) / nCuotas) * 100) / 100, monedaGasto);
                return ya > 0
                  ? `${cuota} por mes. Registro las ${ya} cuotas ya pagadas en los meses anteriores y las ${nCuotas - ya} que faltan desde este mes.`
                  : `El total se divide: ${cuota} por mes durante ${nCuotas} meses, empezando este mes.`;
              })()}
            </div>
          )}
        </React.Fragment>
      )}

      {tipo === "transfer" && (
        <React.Fragment>
          <label style={S.label}>Hacia</label>
          <div style={S.chips}>
            {data.cuentas.filter((c) => c.id !== cuentaId).map((c) => (
              <Chip key={c.id} activo={cuentaDestinoId === c.id} dot={colorEntidad(c.entidad)} onClick={() => setCuentaDestinoId(c.id)}>
                {etiquetaCuenta(c)}
              </Chip>
            ))}
          </div>
          {cruzaMoneda && (
            <React.Fragment>
              <label style={S.label}>Monto que llega en {ctaDestino.moneda === "USD" ? "dólares" : "pesos"}</label>
              <input
                style={S.input}
                inputMode="decimal"
                placeholder={ctaDestino.moneda === "USD" ? "Ej: 100" : "Ej: 120000"}
                value={montoDestino}
                onChange={(e) => setMontoDestino(e.target.value)}
              />
            </React.Fragment>
          )}
        </React.Fragment>
      )}

      {tipo === "gasto" && (
        <React.Fragment>
          <label style={S.label}>Grupo</label>
          <div style={S.chips}>
            {gruposGasto.map((g) => (
              <Chip key={g.nombre} activo={grupo === g.nombre} onClick={() => { setGrupo(g.nombre); setCategoria(""); }}>
                {g.nombre}
              </Chip>
            ))}
          </div>
          <label style={S.label}>Categoría</label>
          <div style={S.chips}>
            {catsDelGrupo.map((cat) => (
              <Chip key={cat} activo={categoria === cat} onClick={() => setCategoria(categoria === cat ? "" : cat)}>
                {cat}
              </Chip>
            ))}
          </div>
        </React.Fragment>
      )}

      {tipo === "ingreso" && (
        <React.Fragment>
          <label style={S.label}>Categoría (opcional)</label>
          <div style={S.chips}>
            {catsIngreso.map((cat) => (
              <Chip key={cat} activo={categoria === cat} onClick={() => setCategoria(categoria === cat ? "" : cat)}>
                {cat}
              </Chip>
            ))}
          </div>
        </React.Fragment>
      )}

      {masOpciones ? (
        <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
          <input
            style={{ ...S.input, flex: 2, marginBottom: 0 }}
            placeholder="Nota — ej: feria, clase particular…"
            value={nota}
            onChange={(e) => setNota(e.target.value)}
          />
          <input
            style={{ ...S.input, flex: 1, marginBottom: 0 }}
            type="date"
            value={fecha}
            onChange={(e) => setFecha(e.target.value)}
          />
        </div>
      ) : (
        <button style={S.btnFantasma} onClick={() => setMasOpciones(true)}>+ nota o fecha</button>
      )}

      <button
        style={{ ...S.btnPrimario, background: puedeGuardar() ? colorTipo : C.linea, marginTop: 14 }}
        onClick={guardarMov}
        disabled={!puedeGuardar()}
      >
        Anotar
      </button>

      {esTarjeta && tipo === "gasto" && (
        <div style={{ fontSize: 12.5, color: C.tintaSuave, marginTop: 8, lineHeight: 1.5 }}>
          Este consumo suma a la deuda de la tarjeta en la moneda que elegiste. Cuando pagues el resumen, registralo desde Cuentas → "Pagar tarjeta".
        </div>
      )}
    </div>
  );
}

// ————— Fijos del mes —————
function Fijos({ data, guardar, avisar }) {
  const [mes, setMes] = useState(mesActual());
  const [pagando, setPagando] = useState(null);
  const [monto, setMonto] = useState("");
  const [cuentaId, setCuentaId] = useState("");
  const [monedaPagoFijo, setMonedaPagoFijo] = useState("");
  const [nuevoFijo, setNuevoFijo] = useState(false);
  const [nfNombre, setNfNombre] = useState("");
  const [nfGrupo, setNfGrupo] = useState("Casa");
  const [nfVence, setNfVence] = useState("");
  const [nfDatos, setNfDatos] = useState("");
  const [editandoFijo, setEditandoFijo] = useState(null);
  const [efNombre, setEfNombre] = useState("");
  const [efGrupo, setEfGrupo] = useState("");
  const [efVence, setEfVence] = useState("");
  const [efDatos, setEfDatos] = useState("");
  const [verPagados, setVerPagados] = useState(false);

  const pagosMes = data.pagosFijos[mes] || {};
  const gruposElegibles = data.grupos.filter((g) => g.nombre !== "Ingresos" && g.nombre !== "Tarjetas");

  const fijosConEstado = data.fijos.map((f) => ({ fijo: f, mov: movQuePagaFijo(data, f, mes) }));
  const pendientes = fijosConEstado.filter((x) => !x.mov);
  const pagadosLista = fijosConEstado.filter((x) => x.mov);
  const gruposPendientes = [...new Set(pendientes.map((x) => x.fijo.grupo))];

  const pagar = (fijo) => {
    const m = parseMonto(monto);
    if (isNaN(m) || m <= 0 || !cuentaId) return;
    const mov = {
      id: uid(),
      tipo: "gasto",
      monto: m,
      cuentaId,
      fecha: mes === mesActual() ? hoy() : `${mes}-28`,
      grupo: fijo.grupo,
      categoria: fijo.categoria,
      nota: "",
      fijoId: fijo.id,
    };
    const cta = data.cuentas.find((c) => c.id === cuentaId);
    if (cta && cta.clase === "credito") mov.monedaMov = monedaPagoFijo || cta.moneda;
    guardar({
      ...data,
      movs: [mov, ...data.movs],
      pagosFijos: { ...data.pagosFijos, [mes]: { ...pagosMes, [fijo.id]: mov.id } },
    });
    setPagando(null); setMonto(""); setCuentaId(""); setMonedaPagoFijo("");
    avisar(`${fijo.categoria} pagado ✓`);
  };

  const deshacer = (fijo, mov) => {
    const nuevosPagos = { ...pagosMes };
    delete nuevosPagos[fijo.id];
    guardar({
      ...data,
      movs: data.movs.filter((m) => m.id !== mov.id),
      pagosFijos: { ...data.pagosFijos, [mes]: nuevosPagos },
    });
    avisar("Pago deshecho — balance actualizado");
  };

  const agregarFijo = () => {
    const n = nfNombre.trim();
    if (!n) return;
    const grupoObj = data.grupos.find((g) => g.nombre === nfGrupo);
    const nuevosGrupos = grupoObj && !grupoObj.categorias.includes(n)
      ? data.grupos.map((g) => (g.nombre === nfGrupo ? { ...g, categorias: [...g.categorias, n] } : g))
      : data.grupos;
    const vd = parseInt(nfVence, 10);
    guardar({ ...data, grupos: nuevosGrupos, fijos: [...data.fijos, { id: uid(), grupo: nfGrupo, categoria: n, venceDia: vd >= 1 && vd <= 31 ? vd : null, datos: nfDatos.trim() }] });
    setNfNombre(""); setNfVence(""); setNfDatos(""); setNuevoFijo(false);
    avisar(`Fijo "${n}" agregado`);
  };

  const guardarEdicionFijo = (fijo) => {
    const nuevoNombre = efNombre.trim();
    if (!nuevoNombre) return;
    const viejoNombre = fijo.categoria;
    const viejoGrupo = fijo.grupo;
    const nuevoGrupo = efGrupo || viejoGrupo;

    let grupos = data.grupos.map((g) => {
      let cats = g.categorias;
      if (g.nombre === viejoGrupo) cats = cats.filter((c) => c !== viejoNombre);
      if (g.nombre === nuevoGrupo && !cats.includes(nuevoNombre)) cats = [...cats, nuevoNombre];
      return { ...g, categorias: cats };
    });

    const movs = data.movs.map((m) =>
      m.categoria === viejoNombre && m.grupo === viejoGrupo
        ? { ...m, categoria: nuevoNombre, grupo: nuevoGrupo }
        : m
    );

    const vd = parseInt(efVence, 10);
    const fijos = data.fijos.map((f) => (f.id === fijo.id ? { ...f, categoria: nuevoNombre, grupo: nuevoGrupo, venceDia: vd >= 1 && vd <= 31 ? vd : null, datos: efDatos.trim() } : f));

    guardar({ ...data, grupos, movs, fijos });
    setEditandoFijo(null);
    avisar("Fijo actualizado en todos lados ✓");
  };

  const quitarFijo = (fijo) => {
    guardar({ ...data, fijos: data.fijos.filter((f) => f.id !== fijo.id) });
    avisar(`"${fijo.categoria}" quitado de los fijos (su historial se conserva)`);
  };

  const totalPagado = pagadosLista.reduce((acc, x) => {
    const mon = monedaDelMov(x.mov, data.cuentas);
    acc[mon] = (acc[mon] || 0) + x.mov.monto;
    return acc;
  }, {});

  return (
    <div style={{ paddingBottom: 90 }}>
      <SelectorMes mes={mes} setMes={setMes} />

      <div style={{ ...S.card, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={{ fontSize: 13, color: C.tintaSuave }}>Pagados este mes</div>
          <div style={{ fontSize: 20, fontWeight: 800, color: pagadosLista.length === data.fijos.length ? C.lav : C.tinta }}>
            {pagadosLista.length} de {data.fijos.length}
          </div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 13, color: C.tintaSuave }}>Total pagado</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: C.gasto, fontVariantNumeric: "tabular-nums" }}>
            {Object.keys(totalPagado).length === 0 ? "—" : Object.entries(totalPagado).map(([m, v]) => fmt(v, m)).join(" · ")}
          </div>
        </div>
      </div>

      {pendientes.length === 0 && (
        <div style={S.vacio}>¡Todos los fijos de {nombreMes(mes).toLowerCase()} están pagados! 🎉</div>
      )}

      {gruposPendientes.map((g) => (
        <div key={g} style={{ marginBottom: 16 }}>
          <div style={S.fechaHeader}>{g}</div>
          {pendientes.filter((x) => x.fijo.grupo === g).map(({ fijo: f }) => {
            const enEdicion = editandoFijo === f.id;
            return (
              <div key={f.id} style={{ ...S.movFila, borderLeft: `3px solid ${C.ambar}` }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14.5, fontWeight: 600, color: C.tinta, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                    {f.categoria}
                    {f.venceDia && (mes < mesActual() || (mes === mesActual() && diaHoy() > f.venceDia)) && (
                      <span style={S.badgeVencido}>VENCIDO</span>
                    )}
                  </div>
                  {f.datos && <div style={{ fontSize: 12, color: C.gris }}>{f.datos}</div>}
                  <div style={{ fontSize: 12.5, color: C.ambar }}>
                    Pendiente{f.venceDia ? ` · vence el ${f.venceDia}` : ""}
                  </div>
                </div>
                {pagando === f.id || enEdicion ? null : (
                  <div style={{ display: "flex", gap: 6 }}>
                    <button style={{ ...S.btnSecundario, padding: "7px 14px", fontSize: 13 }} onClick={() => { setPagando(f.id); setMonto(""); setCuentaId(""); }}>
                      Pagar
                    </button>
                    <button style={S.btnMini} onClick={() => { setEditandoFijo(f.id); setEfNombre(f.categoria); setEfGrupo(f.grupo); setEfVence(f.venceDia ? String(f.venceDia) : ""); setEfDatos(f.datos || ""); }}>editar</button>
                  </div>
                )}

                {enEdicion && (
                  <div style={{ width: "100%", marginTop: 8, paddingTop: 8, borderTop: `1px dashed ${C.linea}` }}>
                    <label style={{ ...S.label, marginTop: 0 }}>Nombre</label>
                    <input style={S.input} value={efNombre} onChange={(e) => setEfNombre(e.target.value)} autoFocus />
                    <label style={{ ...S.label, marginTop: 0 }}>Grupo</label>
                    <div style={S.chips}>
                      {gruposElegibles.map((g2) => (
                        <Chip key={g2.nombre} activo={efGrupo === g2.nombre} onClick={() => setEfGrupo(g2.nombre)}>{g2.nombre}</Chip>
                      ))}
                    </div>
                    <label style={{ ...S.label, marginTop: 6 }}>Día del mes en que vence (opcional)</label>
                    <input style={S.input} inputMode="numeric" placeholder="Ej: 10" value={efVence} onChange={(e) => setEfVence(e.target.value)} />
                    <label style={{ ...S.label, marginTop: 0 }}>Datos del servicio (opcional)</label>
                    <input style={S.input} placeholder="Ej: N° de usuario 12345 · Línea 011-4567-8900" value={efDatos} onChange={(e) => setEfDatos(e.target.value)} />
                    <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                      <button style={{ ...S.btnPrimario, flex: 1, marginTop: 0 }} onClick={() => guardarEdicionFijo(f)}>Guardar cambios</button>
                      <button style={S.btnSecundario} onClick={() => setEditandoFijo(null)}>Cancelar</button>
                      <button style={{ ...S.btnSecundario, color: C.gasto }} onClick={() => { setEditandoFijo(null); quitarFijo(f); }}>Quitar</button>
                    </div>
                  </div>
                )}

                {pagando === f.id && (
                  <div style={{ width: "100%", marginTop: 8 }}>
                    <input
                      style={S.input}
                      inputMode="decimal"
                      placeholder="¿Cuánto salió este mes?"
                      value={monto}
                      onChange={(e) => setMonto(e.target.value)}
                      autoFocus
                    />
                    <label style={{ ...S.label, marginTop: 0 }}>¿De dónde sale?</label>
                    <div style={S.chips}>
                      {data.cuentas.map((c) => (
                        <Chip key={c.id} activo={cuentaId === c.id} dot={colorEntidad(c.entidad)} onClick={() => { setCuentaId(c.id); setMonedaPagoFijo(""); }}>
                          {etiquetaCuenta(c)}
                        </Chip>
                      ))}
                    </div>
                    {(() => {
                      const ctaSel = data.cuentas.find((c) => c.id === cuentaId);
                      if (!ctaSel || ctaSel.clase !== "credito") return null;
                      const monAct = monedaPagoFijo || ctaSel.moneda;
                      return (
                        <React.Fragment>
                          <label style={S.label}>¿En qué moneda es el consumo?</label>
                          <div style={S.chips}>
                            <Chip activo={monAct === "ARS"} onClick={() => setMonedaPagoFijo("ARS")}>Pesos</Chip>
                            <Chip activo={monAct === "USD"} onClick={() => setMonedaPagoFijo("USD")}>Dólares</Chip>
                          </div>
                        </React.Fragment>
                      );
                    })()}
                    <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                      <button
                        style={{ ...S.btnPrimario, flex: 1, marginTop: 0, background: parseMonto(monto) > 0 && cuentaId ? C.lav : C.linea }}
                        onClick={() => pagar(f)}
                        disabled={!(parseMonto(monto) > 0 && cuentaId)}
                      >
                        Registrar pago
                      </button>
                      <button style={S.btnSecundario} onClick={() => setPagando(null)}>Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}

      {pagadosLista.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <button style={{ ...S.acordeonHeader, background: C.carta, border: `1px solid ${C.linea}`, borderRadius: 12 }} onClick={() => setVerPagados(!verPagados)}>
            <span style={{ fontSize: 14, fontWeight: 700, color: C.lav }}>
              <span style={{ marginRight: 8, fontSize: 13 }}>{verPagados ? "▾" : "▸"}</span>
              ✓ Ya pagados este mes ({pagadosLista.length})
            </span>
          </button>
          {verPagados && pagadosLista.map(({ fijo: f, mov }) => (
            <div key={f.id} style={{ ...S.movFila, borderLeft: `3px solid ${C.lav}`, marginTop: 8, opacity: 0.85 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: C.tinta }}>{f.categoria}</div>
                <div style={{ fontSize: 12.5, color: C.lav }}>
                  Pagado · {fmt(mov.monto, monedaDelMov(mov, data.cuentas))} · {etiquetaCuenta(data.cuentas.find((c) => c.id === mov.cuentaId))}
                </div>
              </div>
              <button style={S.btnMini} onClick={() => deshacer(f, mov)}>deshacer</button>
            </div>
          ))}
        </div>
      )}

      {nuevoFijo ? (
        <div style={S.card}>
          <label style={{ ...S.label, marginTop: 0 }}>Nombre del gasto fijo</label>
          <input style={S.input} placeholder="Ej: Seguro, gimnasio…" value={nfNombre} onChange={(e) => setNfNombre(e.target.value)} />
          <label style={{ ...S.label, marginTop: 0 }}>Grupo</label>
          <div style={S.chips}>
            {gruposElegibles.map((g) => (
              <Chip key={g.nombre} activo={nfGrupo === g.nombre} onClick={() => setNfGrupo(g.nombre)}>{g.nombre}</Chip>
            ))}
          </div>
          <label style={{ ...S.label, marginTop: 6 }}>Día del mes en que vence (opcional)</label>
          <input style={S.input} inputMode="numeric" placeholder="Ej: 10" value={nfVence} onChange={(e) => setNfVence(e.target.value)} />
          <label style={{ ...S.label, marginTop: 0 }}>Datos del servicio (opcional)</label>
          <input style={S.input} placeholder="Ej: N° de usuario 12345" value={nfDatos} onChange={(e) => setNfDatos(e.target.value)} />
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button style={{ ...S.btnPrimario, flex: 1, marginTop: 0 }} onClick={agregarFijo}>Agregar</button>
            <button style={S.btnSecundario} onClick={() => setNuevoFijo(false)}>Cancelar</button>
          </div>
        </div>
      ) : (
        <button style={{ ...S.btnSecundario, width: "100%" }} onClick={() => setNuevoFijo(true)}>+ Nuevo gasto fijo</button>
      )}
    </div>
  );
}

// ————— Resumen mensual con desplegables —————
function Resumen({ data }) {
  const [mes, setMes] = useState(mesActual());
  const [abiertos, setAbiertos] = useState({});

  const toggle = (k) => setAbiertos((a) => ({ ...a, [k]: !a[k] }));

  const movsMes = data.movs.filter((m) => m.fecha.slice(0, 7) === mes);
  const nombreCta = (id) => etiquetaCuenta(data.cuentas.find((x) => x.id === id));

  const suma = (movs) =>
    movs.reduce((acc, m) => {
      const mon = monedaDelMov(m, data.cuentas);
      acc[mon] = (acc[mon] || 0) + m.monto;
      return acc;
    }, {});

  const fmtSuma = (s) => {
    const partes = Object.entries(s).filter(([, v]) => v > 0);
    return partes.length === 0 ? "—" : partes.map(([m, v]) => fmt(v, m)).join(" · ");
  };

  const gastos = movsMes.filter((m) => m.tipo === "gasto");
  const ingresos = movsMes.filter((m) => m.tipo === "ingreso");

  const ordenGrupos = data.grupos.map((g) => g.nombre);
  const gruposDelMes = [...new Set(gastos.map((m) => m.grupo || "Otros"))].sort(
    (a, b) => ordenGrupos.indexOf(a) - ordenGrupos.indexOf(b)
  );

  const tarjetas = data.cuentas.filter((c) => c.clase === "credito");
  const consumosTarjeta = (tid) => gastos.filter((m) => m.cuentaId === tid);
  const pagosTarjeta = (tid) => movsMes.filter((m) => m.tipo === "transfer" && m.cuentaDestinoId === tid);

  return (
    <div style={{ paddingBottom: 90 }}>
      <SelectorMes mes={mes} setMes={setMes} />

      <div style={{ ...S.card, display: "flex", gap: 24, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontSize: 12, color: C.tintaSuave, textTransform: "uppercase", letterSpacing: "0.06em" }}>Ingresos</div>
          <div style={{ fontSize: 17, fontWeight: 700, color: C.ingreso, fontVariantNumeric: "tabular-nums" }}>{fmtSuma(suma(ingresos))}</div>
        </div>
        <div>
          <div style={{ fontSize: 12, color: C.tintaSuave, textTransform: "uppercase", letterSpacing: "0.06em" }}>Gastos</div>
          <div style={{ fontSize: 17, fontWeight: 700, color: C.gasto, fontVariantNumeric: "tabular-nums" }}>{fmtSuma(suma(gastos))}</div>
        </div>
      </div>

      <div style={S.fechaHeader}>Gastos por grupo — tocá para abrir</div>

      {gruposDelMes.length === 0 && <div style={S.vacio}>Sin gastos anotados en {nombreMes(mes).toLowerCase()}.</div>}

      {gruposDelMes.map((g) => {
        const movsGrupo = gastos.filter((m) => (m.grupo || "Otros") === g);
        const abierto = abiertos[g];
        const cats = [...new Set(movsGrupo.map((m) => m.categoria))];
        return (
          <div key={g} style={{ ...S.card, padding: 0, overflow: "hidden" }}>
            <button style={S.acordeonHeader} onClick={() => toggle(g)}>
              <span style={{ fontSize: 15, fontWeight: 700, color: C.tinta }}>
                <span style={{ color: C.lav, marginRight: 8, fontSize: 13 }}>{abierto ? "▾" : "▸"}</span>
                {g}
              </span>
              <span style={{ fontSize: 14.5, fontWeight: 700, color: C.gasto, fontVariantNumeric: "tabular-nums" }}>
                {fmtSuma(suma(movsGrupo))}
              </span>
            </button>
            {abierto && (
              <div style={{ borderTop: `1px solid ${C.linea}` }}>
                {cats.map((cat) => {
                  const movsCat = movsGrupo.filter((m) => m.categoria === cat);
                  const kCat = `${g}|${cat}`;
                  const abiertoCat = abiertos[kCat];
                  return (
                    <div key={cat}>
                      <button style={{ ...S.acordeonHeader, padding: "10px 16px 10px 28px", background: "#FAF9FC" }} onClick={() => toggle(kCat)}>
                        <span style={{ fontSize: 14, fontWeight: 600, color: C.tinta }}>
                          <span style={{ color: C.gris, marginRight: 6, fontSize: 12 }}>{abiertoCat ? "▾" : "▸"}</span>
                          {cat}
                          <span style={{ color: C.gris, fontWeight: 500, marginLeft: 6, fontSize: 12.5 }}>
                            {movsCat.length > 1 ? `· ${movsCat.length} movs` : ""}
                          </span>
                        </span>
                        <span style={{ fontSize: 13.5, fontWeight: 700, color: C.tinta, fontVariantNumeric: "tabular-nums" }}>
                          {fmtSuma(suma(movsCat))}
                        </span>
                      </button>
                      {abiertoCat && movsCat.map((m) => (
                        <div key={m.id} style={{ display: "flex", justifyContent: "space-between", padding: "7px 16px 7px 44px", fontSize: 13, color: C.tintaSuave, borderTop: `1px dashed ${C.linea}` }}>
                          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginRight: 10 }}>
                            {fmtFecha(m.fecha)} · {nombreCta(m.cuentaId)}{m.nota ? ` · ${m.nota}` : ""}
                          </span>
                          <span style={{ fontVariantNumeric: "tabular-nums", flexShrink: 0 }}>{fmt(m.monto, monedaDelMov(m, data.cuentas))}</span>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}

      {tarjetas.length > 0 && (
        <React.Fragment>
          <div style={{ ...S.fechaHeader, marginTop: 20 }}>Tarjetas este mes</div>
          {tarjetas.map((t) => {
            const consumos = consumosTarjeta(t.id);
            const pagos = pagosTarjeta(t.id);
            const k = `tarjeta|${t.id}`;
            const abierto = abiertos[k];
            if (consumos.length === 0 && pagos.length === 0) return null;
            return (
              <div key={t.id} style={{ ...S.card, padding: 0, overflow: "hidden", borderLeft: `4px solid ${colorEntidad(t.entidad)}` }}>
                <button style={S.acordeonHeader} onClick={() => toggle(k)}>
                  <span style={{ fontSize: 14.5, fontWeight: 700, color: C.tinta }}>
                    <span style={{ color: colorEntidad(t.entidad), marginRight: 8, fontSize: 13 }}>{abierto ? "▾" : "▸"}</span>
                    {t.entidad} · {t.nombre}
                  </span>
                  <span style={{ fontSize: 13, color: C.gris }}>
                    {consumos.length} consumos · {pagos.length} pagos
                  </span>
                </button>
                {abierto && (
                  <div style={{ borderTop: `1px solid ${C.linea}`, padding: "8px 16px 12px" }}>
                    <div style={{ fontSize: 13, color: C.tintaSuave, marginBottom: 4 }}>
                      Consumos: <b style={{ color: C.gasto }}>{fmtSuma(suma(consumos))}</b>
                    </div>
                    <div style={{ fontSize: 13, color: C.tintaSuave }}>
                      Pagos hechos: <b style={{ color: C.ingreso }}>{pagos.length === 0 ? "—" : pagos.map((p) => `${fmt(p.monto, (data.cuentas.find((c) => c.id === p.cuentaId) || {}).moneda || "ARS")} desde ${nombreCta(p.cuentaId)}`).join(" · ")}</b>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </React.Fragment>
      )}
    </div>
  );
}

function SelectorMes({ mes, setMes }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
      <button style={S.btnSecundario} onClick={() => setMes(mesAnterior(mes))}>‹</button>
      <div style={{ fontSize: 16, fontWeight: 800, color: C.lavOscuro }}>{nombreMes(mes)}</div>
      <button
        style={{ ...S.btnSecundario, opacity: mes >= mesActual() ? 0.35 : 1 }}
        onClick={() => mes < mesActual() && setMes(mesSiguiente(mes))}
      >
        ›
      </button>
    </div>
  );
}

// ————— Historial —————
function Historial({ data, guardar, avisar }) {
  const [filtroCuenta, setFiltroCuenta] = useState("");
  const [confirmar, setConfirmar] = useState(null);
  const [editando, setEditando] = useState(null);

  const movs = data.movs.filter((m) => !filtroCuenta || m.cuentaId === filtroCuenta || m.cuentaDestinoId === filtroCuenta);
  const nombreCta = (id) => etiquetaCuenta(data.cuentas.find((x) => x.id === id));

  const guardarEdicion = (id, cambios) => {
    guardar({ ...data, movs: data.movs.map((m) => (m.id === id ? { ...m, ...cambios } : m)) });
    setEditando(null);
    avisar("Movimiento actualizado ✓");
  };

  const borrar = (id) => {
    const nuevosPagosFijos = {};
    Object.entries(data.pagosFijos).forEach(([mes, pagos]) => {
      const limpio = {};
      Object.entries(pagos).forEach(([fid, mid]) => { if (mid !== id) limpio[fid] = mid; });
      nuevosPagosFijos[mes] = limpio;
    });
    guardar({ ...data, movs: data.movs.filter((m) => m.id !== id), pagosFijos: nuevosPagosFijos });
    setConfirmar(null);
    avisar("Movimiento borrado — balances actualizados");
  };

  const porFecha = movs.reduce((acc, m) => { (acc[m.fecha] = acc[m.fecha] || []).push(m); return acc; }, {});
  const fechas = Object.keys(porFecha).sort().reverse();

  return (
    <div style={{ paddingBottom: 90 }}>
      <div style={{ ...S.chips, marginBottom: 16 }}>
        <Chip activo={!filtroCuenta} onClick={() => setFiltroCuenta("")}>Todas</Chip>
        {data.cuentas.map((c) => (
          <Chip key={c.id} activo={filtroCuenta === c.id} dot={colorEntidad(c.entidad)} onClick={() => setFiltroCuenta(c.id)}>
            {etiquetaCuenta(c)}
          </Chip>
        ))}
      </div>

      {fechas.length === 0 && <div style={S.vacio}>Todavía no hay movimientos acá. Anotá el primero desde Inicio.</div>}

      {fechas.map((f) => (
        <div key={f} style={{ marginBottom: 18 }}>
          <div style={S.fechaHeader}>{fmtFecha(f)}</div>
          {porFecha[f].map((m) => {
            const ctaMov = data.cuentas.find((c) => c.id === m.cuentaId);
            const enEdicion = editando === m.id;
            return (
              <div key={m.id} style={{ ...S.movFila, flexWrap: "wrap" }}>
                <div style={{
                  width: 4, alignSelf: "stretch", borderRadius: 2,
                  background: ctaMov ? colorEntidad(ctaMov.entidad) : C.gris,
                }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14.5, fontWeight: 600, color: C.tinta, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {m.nota || m.categoria}
                  </div>
                  <div style={{ fontSize: 12.5, color: C.tintaSuave, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {m.tipo === "transfer"
                      ? `${nombreCta(m.cuentaId)} → ${nombreCta(m.cuentaDestinoId)}`
                      : `${m.grupo ? m.grupo + " · " : ""}${m.categoria} · ${nombreCta(m.cuentaId)}`}
                  </div>
                </div>
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  <div style={{
                    fontSize: 14.5, fontWeight: 700, fontVariantNumeric: "tabular-nums",
                    color: m.tipo === "gasto" ? C.gasto : m.tipo === "ingreso" ? C.ingreso : C.transfer,
                  }}>
                    {m.tipo === "gasto" ? "−" : m.tipo === "ingreso" ? "+" : ""}{fmt(m.monto, monedaDelMov(m, data.cuentas))}
                  </div>
                  {confirmar === m.id ? (
                    <div style={{ display: "flex", gap: 6, justifyContent: "flex-end", marginTop: 2 }}>
                      <button style={{ ...S.btnMini, color: C.gasto }} onClick={() => borrar(m.id)}>Sí, borrar</button>
                      <button style={S.btnMini} onClick={() => setConfirmar(null)}>No</button>
                    </div>
                  ) : (
                    <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                      <button style={S.btnMini} onClick={() => setEditando(enEdicion ? null : m.id)}>editar</button>
                      <button style={S.btnMini} onClick={() => setConfirmar(m.id)}>borrar</button>
                    </div>
                  )}
                </div>
                {enEdicion && (
                  <EditarMovimiento
                    mov={m}
                    data={data}
                    onGuardar={(cambios) => guardarEdicion(m.id, cambios)}
                    onCancelar={() => setEditando(null)}
                  />
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ————— Editar un movimiento ya cargado —————
function EditarMovimiento({ mov, data, onGuardar, onCancelar }) {
  const [monto, setMonto] = useState(String(mov.monto));
  const [fecha, setFecha] = useState(mov.fecha);
  const [nota, setNota] = useState(mov.nota || "");
  const [cuentaId, setCuentaId] = useState(mov.cuentaId);
  const [grupo, setGrupo] = useState(mov.grupo || "Diarios");
  const [categoria, setCategoria] = useState(mov.categoria || "");
  const [monedaMov, setMonedaMov] = useState(mov.monedaMov || "");

  const esGasto = mov.tipo === "gasto";
  const esIngreso = mov.tipo === "ingreso";
  const cta = data.cuentas.find((c) => c.id === cuentaId);
  const esTarjeta = cta && cta.clase === "credito";
  const catsDelGrupo = (data.grupos.find((g) => g.nombre === grupo) || { categorias: [] }).categorias;
  const catsIngreso = (data.grupos.find((g) => g.nombre === "Ingresos") || { categorias: [] }).categorias;
  const gruposGasto = data.grupos.filter((g) => g.nombre !== "Ingresos");

  const listo = () => {
    const m = parseMonto(monto);
    if (isNaN(m) || m <= 0 || !cuentaId || !fecha) return false;
    if (esGasto && !categoria) return false;
    return true;
  };

  return (
    <div style={{ width: "100%", marginTop: 10, paddingTop: 10, borderTop: `1px dashed ${C.linea}` }}>
      <label style={{ ...S.label, marginTop: 0 }}>Monto</label>
      <input style={S.input} inputMode="decimal" value={monto} onChange={(e) => setMonto(e.target.value)} autoFocus />

      <label style={{ ...S.label, marginTop: 0 }}>Fecha</label>
      <input style={S.input} type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} />

      <label style={{ ...S.label, marginTop: 0 }}>{mov.tipo === "transfer" ? "Desde" : esIngreso ? "Entra a" : "Sale de"}</label>
      <div style={S.chips}>
        {data.cuentas.map((c) => (
          <Chip key={c.id} activo={cuentaId === c.id} dot={colorEntidad(c.entidad)} onClick={() => setCuentaId(c.id)}>
            {etiquetaCuenta(c)}
          </Chip>
        ))}
      </div>

      {esGasto && esTarjeta && (
        <React.Fragment>
          <label style={S.label}>Moneda del consumo</label>
          <div style={S.chips}>
            <Chip activo={(monedaMov || cta.moneda) === "ARS"} onClick={() => setMonedaMov("ARS")}>Pesos</Chip>
            <Chip activo={(monedaMov || cta.moneda) === "USD"} onClick={() => setMonedaMov("USD")}>Dólares</Chip>
          </div>
        </React.Fragment>
      )}

      {esGasto && (
        <React.Fragment>
          <label style={S.label}>Grupo</label>
          <div style={S.chips}>
            {gruposGasto.map((g) => (
              <Chip key={g.nombre} activo={grupo === g.nombre} onClick={() => { setGrupo(g.nombre); setCategoria(""); }}>{g.nombre}</Chip>
            ))}
          </div>
          <label style={S.label}>Categoría</label>
          <div style={S.chips}>
            {catsDelGrupo.map((cat) => (
              <Chip key={cat} activo={categoria === cat} onClick={() => setCategoria(cat)}>{cat}</Chip>
            ))}
          </div>
        </React.Fragment>
      )}

      {esIngreso && (
        <React.Fragment>
          <label style={S.label}>Categoría</label>
          <div style={S.chips}>
            {catsIngreso.map((cat) => (
              <Chip key={cat} activo={categoria === cat} onClick={() => setCategoria(cat)}>{cat}</Chip>
            ))}
          </div>
        </React.Fragment>
      )}

      <label style={{ ...S.label }}>Nota</label>
      <input style={S.input} value={nota} onChange={(e) => setNota(e.target.value)} placeholder="Opcional" />

      <div style={{ display: "flex", gap: 8 }}>
        <button
          style={{ ...S.btnPrimario, flex: 1, marginTop: 0, background: listo() ? C.lav : C.linea }}
          disabled={!listo()}
          onClick={() => {
            const cambios = {
              monto: parseMonto(monto),
              fecha,
              nota: nota.trim(),
              cuentaId,
            };
            if (esGasto) { cambios.grupo = grupo; cambios.categoria = categoria; }
            if (esIngreso) cambios.categoria = categoria || "Otros ingresos";
            if (esGasto && esTarjeta) cambios.monedaMov = monedaMov || cta.moneda;
            onGuardar(cambios);
          }}
        >
          Guardar cambios
        </button>
        <button style={S.btnSecundario} onClick={onCancelar}>Cancelar</button>
      </div>
    </div>
  );
}

// ————— Pestaña Tarjetas —————
function Tarjetas({ data, deudasTarjetas, guardar, avisar }) {
  const [mes, setMes] = useState(mesActual());
  const [cargando, setCargando] = useState(null); // id de tarjeta donde estoy cargando consumo
  const [abierta, setAbierta] = useState(null);

  const tarjetas = data.cuentas.filter((c) => c.clase === "credito");

  if (tarjetas.length === 0) {
    return <div style={S.vacio}>No tenés tarjetas cargadas. Creá una desde Cuentas → + Nueva cuenta, tipo "Tarjeta de crédito".</div>;
  }

  // Planes de cuotas activos de una tarjeta: agrupa por compra y cuenta lo que falta
  const planesDeCuotas = (tid) => {
    const porCompra = {};
    data.movs.forEach((m) => {
      if (m.cuentaId !== tid || !m.compraId) return;
      if (!porCompra[m.compraId]) porCompra[m.compraId] = [];
      porCompra[m.compraId].push(m);
    });
    return Object.values(porCompra).map((cuotas) => {
      const ordenadas = cuotas.sort((a, b) => a.fecha.localeCompare(b.fecha));
      const primera = ordenadas[0];
      const pagadas = ordenadas.filter((c) => c.fecha.slice(0, 7) < mesActual()).length;
      const total = primera.cuotasTotal || ordenadas.length;
      const restantes = ordenadas.filter((c) => c.fecha.slice(0, 7) >= mesActual());
      return {
        nombre: primera.compraNombre || primera.categoria,
        moneda: primera.monedaMov || "ARS",
        montoCuota: primera.monto,
        total,
        pagadas,
        faltan: total - pagadas,
        restaSaldo: restantes.reduce((s, c) => s + c.monto, 0),
        proxima: restantes[0],
      };
    }).filter((p) => p.faltan > 0);
  };

  const consumosDelMes = (tid) =>
    data.movs.filter((m) => m.tipo === "gasto" && m.cuentaId === tid && m.fecha.slice(0, 7) === mes);

  const sumaPorMoneda = (movs) =>
    movs.reduce((acc, m) => {
      const mon = m.monedaMov || "ARS";
      acc[mon] = (acc[mon] || 0) + m.monto;
      return acc;
    }, {});

  const fmtMonedas = (obj) => {
    const p = Object.entries(obj).filter(([, v]) => v > 0);
    return p.length === 0 ? "—" : p.map(([m, v]) => fmt(v, m)).join(" · ");
  };

  const pagosDelMes = (tid) =>
    data.movs.filter((m) => m.tipo === "transfer" && m.cuentaDestinoId === tid && m.fecha.slice(0, 7) === mes);

  return (
    <div style={{ paddingBottom: 90 }}>
      <SelectorMes mes={mes} setMes={setMes} />

      {tarjetas.map((t) => {
        const col = colorEntidad(t.entidad);
        const d = deudasTarjetas[t.id] || { ARS: 0, USD: 0 };
        const conDeuda = d.ARS > 0 || d.USD > 0;
        const consumos = consumosDelMes(t.id);
        const pagos = pagosDelMes(t.id);
        const planes = planesDeCuotas(t.id);
        const vencida = tarjetaVencida(t, data, d) && mes === mesActual();
        const ciclo = cicloTarjeta(t);
        const abierto = abierta === t.id;

        return (
          <div key={t.id} style={{ ...S.card, borderLeft: `4px solid ${col}`, padding: "16px 14px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap" }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 800, color: C.tinta, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ width: 10, height: 10, borderRadius: 5, background: col, display: "inline-block" }} />
                  {t.entidad}
                  {vencida && <span style={S.badgeVencido}>VENCIDO</span>}
                </div>
                <div style={{ fontSize: 12.5, color: C.tintaSuave }}>{t.nombre}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 11, color: C.gris, textTransform: "uppercase", letterSpacing: "0.06em" }}>Deuda total hoy</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: conDeuda ? C.gasto : C.ingreso, fontVariantNumeric: "tabular-nums" }}>
                  {conDeuda ? [d.ARS > 0 && fmt(d.ARS, "ARS"), d.USD > 0 && fmt(d.USD, "USD")].filter(Boolean).join(" + ") : "Sin deuda ✓"}
                </div>
              </div>
            </div>

            <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginTop: 10, paddingTop: 10, borderTop: `1px dashed ${C.linea}` }}>
              <MiniDato titulo="Cierra" valor={ciclo ? `${fmtFechaLarga(ciclo.cierre)} · ${ciclo.diasACierre === 0 ? "hoy" : "en " + ciclo.diasACierre + "d"}` : "sin cargar"} />
              <MiniDato titulo="Vence" valor={ciclo && ciclo.vencimiento ? `${fmtFechaLarga(ciclo.vencimiento)} · ${ciclo.diasAVencimiento === 0 ? "hoy" : "en " + ciclo.diasAVencimiento + "d"}` : "sin cargar"} color={vencida ? C.gasto : undefined} />
              <MiniDato titulo={`Consumos ${nombreMes(mes).split(" ")[0].toLowerCase()}`} valor={fmtMonedas(sumaPorMoneda(consumos))} color={consumos.length ? C.gasto : undefined} />
              <MiniDato
                titulo="Pagos del mes"
                valor={pagos.length === 0 ? "sin pagos" : fmtMonedas(pagos.reduce((a, p) => { const mo = p.monedaPagoTarjeta || t.moneda; a[mo] = (a[mo] || 0) + (p.montoDestino != null ? p.montoDestino : p.monto); return a; }, {}))}
                color={pagos.length ? C.ingreso : C.ambar}
              />
            </div>

            {planes.length > 0 && (
              <div style={{ marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${C.linea}` }}>
                <div style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: C.lavOscuro, marginBottom: 6 }}>
                  Cuotas en curso ({planes.length})
                </div>
                {planes.map((p, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, padding: "6px 0", borderBottom: i < planes.length - 1 ? `1px dashed ${C.linea}` : "none" }}>
                    <div style={{ minWidth: 0, flex: 1 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600, color: C.tinta, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.nombre}</div>
                      <div style={{ fontSize: 12, color: C.tintaSuave }}>
                        Cuota {p.pagadas + 1} de {p.total} · faltan {p.faltan} · {fmt(p.montoCuota, p.moneda)} por mes
                      </div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <div style={{ fontSize: 10.5, color: C.gris, textTransform: "uppercase" }}>resta</div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: C.gasto, fontVariantNumeric: "tabular-nums" }}>{fmt(p.restaSaldo, p.moneda)}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
              <button style={{ ...S.btnSecundario, flex: 1 }} onClick={() => setCargando(cargando === t.id ? null : t.id)}>
                + Cargar consumo
              </button>
              <button style={{ ...S.btnSecundario, flex: 1 }} onClick={() => setAbierta(abierto ? null : t.id)}>
                {abierto ? "Ocultar detalle" : "Ver detalle del mes"}
              </button>
            </div>

            {cargando === t.id && (
              <CargarConsumoTarjeta
                tarjeta={t}
                data={data}
                onCargar={(movs) => {
                  guardar({ ...data, movs: [...movs, ...data.movs] });
                  setCargando(null);
                  avisar("Consumo cargado ✓");
                }}
                onCancelar={() => setCargando(null)}
              />
            )}

            {abierto && (
              <div style={{ marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${C.linea}` }}>
                <div style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: C.tintaSuave, marginBottom: 6 }}>
                  Consumos de {nombreMes(mes).toLowerCase()}
                </div>
                {consumos.length === 0 && <div style={{ fontSize: 13, color: C.gris }}>Sin consumos este mes.</div>}
                {consumos.map((m) => (
                  <div key={m.id} style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 13, color: C.tintaSuave, padding: "5px 0", borderBottom: `1px dashed ${C.linea}` }}>
                    <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      {fmtFecha(m.fecha)} · {m.nota || m.categoria}
                    </span>
                    <span style={{ fontVariantNumeric: "tabular-nums", flexShrink: 0, color: C.tinta, fontWeight: 600 }}>
                      {fmt(m.monto, m.monedaMov || "ARS")}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}

      <div style={{ fontSize: 12.5, color: C.gris, lineHeight: 1.5, marginTop: 6 }}>
        Para registrar el pago de una tarjeta, andá a Cuentas → "Pagar tarjeta". Ahí elegís qué parte del resumen pagás y de dónde sale la plata.
      </div>
    </div>
  );
}

// ————— Cargar consumo de tarjeta (con cuotas, incluso retroactivas) —————
function CargarConsumoTarjeta({ tarjeta, data, onCargar, onCancelar }) {
  const [monto, setMonto] = useState("");
  const [moneda, setMoneda] = useState(tarjeta.moneda);
  const [grupo, setGrupo] = useState("Diarios");
  const [categoria, setCategoria] = useState("");
  const [nota, setNota] = useState("");
  const [fecha, setFecha] = useState(hoy());
  const [cuotas, setCuotas] = useState(1);
  const [cuotasOtro, setCuotasOtro] = useState("");
  const [yaPagas, setYaPagas] = useState("");

  const nCuotas = cuotas === "otro" ? parseInt(cuotasOtro, 10) || 0 : cuotas;
  const gruposGasto = data.grupos.filter((g) => g.nombre !== "Ingresos");
  const cats = (data.grupos.find((g) => g.nombre === grupo) || { categorias: [] }).categorias;

  const listo = () => {
    const m = parseMonto(monto);
    return !isNaN(m) && m > 0 && categoria && nCuotas >= 1;
  };

  const cargar = () => {
    const m = parseMonto(monto);
    if (!listo()) return;
    const movs = [];
    if (nCuotas > 1) {
      const ya = Math.max(0, Math.min(parseInt(yaPagas, 10) || 0, nCuotas - 1));
      const porCuota = Math.round((m / nCuotas) * 100) / 100;
      const compraId = uid();
      let acum = 0;
      for (let i = 1; i <= nCuotas; i++) {
        const mc = i === nCuotas ? Math.round((m - acum) * 100) / 100 : porCuota;
        acum += mc;
        movs.push({
          id: uid() + i, tipo: "gasto", monto: mc, cuentaId: tarjeta.id,
          fecha: sumarMeses(fecha, i - 1 - ya),
          nota: `${nota.trim() ? nota.trim() + " " : ""}(cuota ${i}/${nCuotas})`,
          grupo, categoria, monedaMov: moneda,
          cuotasTotal: nCuotas, cuotaNum: i, compraId,
          compraNombre: nota.trim() || categoria,
        });
      }
    } else {
      movs.push({
        id: uid(), tipo: "gasto", monto: m, cuentaId: tarjeta.id, fecha,
        nota: nota.trim(), grupo, categoria, monedaMov: moneda,
      });
    }
    onCargar(movs);
  };

  return (
    <div style={{ marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${C.linea}` }}>
      <label style={{ ...S.label, marginTop: 0 }}>Monto total de la compra</label>
      <input style={S.input} inputMode="decimal" placeholder="Ej: 45000" value={monto} onChange={(e) => setMonto(e.target.value)} autoFocus />

      <label style={{ ...S.label, marginTop: 0 }}>¿En qué moneda?</label>
      <div style={S.chips}>
        <Chip activo={moneda === "ARS"} onClick={() => setMoneda("ARS")}>Pesos</Chip>
        <Chip activo={moneda === "USD"} onClick={() => setMoneda("USD")}>Dólares</Chip>
      </div>

      <label style={S.label}>¿En cuántas cuotas?</label>
      <div style={S.chips}>
        {[1, 3, 6, 12].map((n) => (
          <Chip key={n} activo={cuotas === n} onClick={() => { setCuotas(n); setCuotasOtro(""); }}>
            {n === 1 ? "Un pago" : `${n} cuotas`}
          </Chip>
        ))}
        <Chip activo={cuotas === "otro"} onClick={() => setCuotas("otro")}>Otra</Chip>
      </div>
      {cuotas === "otro" && (
        <input style={{ ...S.input, marginTop: 6 }} inputMode="numeric" placeholder="¿Cuántas cuotas?" value={cuotasOtro} onChange={(e) => setCuotasOtro(e.target.value)} />
      )}

      {nCuotas > 1 && (
        <React.Fragment>
          <label style={S.label}>¿Cuántas cuotas ya pagaste?</label>
          <input style={S.input} inputMode="numeric" placeholder="0 si arranca este mes" value={yaPagas} onChange={(e) => setYaPagas(e.target.value)} />
          {parseMonto(monto) > 0 && (
            <div style={{ fontSize: 12.5, color: C.tintaSuave, marginBottom: 8, lineHeight: 1.5 }}>
              {fmt(Math.round((parseMonto(monto) / nCuotas) * 100) / 100, moneda)} por mes.
              {(parseInt(yaPagas, 10) || 0) > 0
                ? ` Las ${Math.min(parseInt(yaPagas, 10), nCuotas - 1)} ya pagadas quedan en los meses anteriores.`
                : " Empieza este mes."}
            </div>
          )}
        </React.Fragment>
      )}

      <label style={S.label}>Grupo</label>
      <div style={S.chips}>
        {gruposGasto.map((g) => (
          <Chip key={g.nombre} activo={grupo === g.nombre} onClick={() => { setGrupo(g.nombre); setCategoria(""); }}>{g.nombre}</Chip>
        ))}
      </div>
      <label style={S.label}>Categoría</label>
      <div style={S.chips}>
        {cats.map((c) => (
